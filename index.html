<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#07100a">

<title>Shot Caller</title>

<style>
/* =========================================================
   SHOT CALLER
   ========================================================= */

:root {
  --bg: #060b08;
  --panel: #0d1510;
  --panel2: #111c15;
  --border: #26342b;

  --green: #39e47d;
  --green-dark: #1eaa58;

  --red: #ff4141;
  --blue: #5ca9ff;
  --gold: #eac348;

  --text: #f4f6f3;
  --muted: #8e9b92;

  --wood: #4a2d1c;
  --wood-light: #684329;

  --felt: #126d45;
  --felt-dark: #0d5738;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(
      ellipse at top,
      #17251b 0%,
      var(--bg) 55%
    );
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

body {
  padding-bottom: env(safe-area-inset-bottom);
}

button {
  font: inherit;
}

.app {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}

.logo {
  width: 36px;
  height: 36px;

  display: grid;
  place-items: center;

  border-radius: 10px;

  background:
    linear-gradient(
      145deg,
      #4aee8a,
      #24b961
    );

  color: #041009;

  font-size: 10px;
  font-weight: 1000;
  letter-spacing: -0.04em;

  box-shadow:
    0 6px 20px rgba(57, 228, 125, .18);
}

.brand-name {
  font-size: 21px;
  line-height: 1;

  font-weight: 950;
  letter-spacing: -.055em;
}

.brand-sub {
  margin-top: 4px;

  font-size: 9px;
  font-weight: 650;

  color: var(--muted);
}

.live {
  display: flex;
  align-items: center;
  gap: 6px;

  color: var(--green);

  font-size: 8px;
  font-weight: 900;
  letter-spacing: .14em;
}

.live-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 10px var(--green);
}

/* =========================================================
   LAYOUT
   ========================================================= */

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 305px;
  gap: 10px;
}

/* =========================================================
   TABLE
   ========================================================= */

.table-card {
  padding: 6px;

  border-radius: 17px;

  background:
    linear-gradient(
      145deg,
      #0c1710,
      #08110c
    );

  border: 1px solid var(--border);

  box-shadow:
    0 18px 50px rgba(0, 0, 0, .28);
}

/*
  IMPORTANT:

  The canvas always has a known 2:1 aspect ratio.
  Its internal coordinate system is ALWAYS 1000 x 500.

  This avoids the rendering bug caused by attempting
  to calculate the canvas's world dimensions from its
  own CSS dimensions.
*/

.table-wrap {
  position: relative;

  width: 100%;

  aspect-ratio: 2 / 1;

  overflow: hidden;

  border-radius: 12px;

  touch-action: none;
  user-select: none;
}

#table {
  display: block;

  width: 100%;
  height: 100%;

  touch-action: none;
  user-select: none;
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* =========================================================
   BALL SELECT
   ========================================================= */

.ball-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;

  padding: 6px;

  border-radius: 13px;

  background: var(--panel);
  border: 1px solid var(--border);
}

.ball-button {
  height: 44px;

  border: 1px solid var(--border);
  border-radius: 9px;

  background: var(--panel2);
  color: var(--muted);

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}

.ball-button.selected {
  color: var(--green);

  border-color: var(--green);

  background:
    rgba(57, 228, 125, .10);

  box-shadow:
    inset 0 0 0 1px rgba(57, 228, 125, .06);
}

.ball-icon {
  display: inline-block;

  width: 11px;
  height: 11px;

  margin-right: 5px;

  vertical-align: -1px;

  border-radius: 50%;
}

.ball-icon.cue {
  background: #f4f4f0;

  box-shadow:
    0 0 0 1px #777;
}

.ball-icon.object {
  background: var(--gold);
}

/* =========================================================
   SHOT CARD
   ========================================================= */

.shot-card {
  padding: 12px;

  border-radius: 14px;

  background:
    linear-gradient(
      150deg,
      #0e1912,
      #0a130e
    );

  border: 1px solid var(--border);
}

.kicker {
  color: var(--green);

  font-size: 8px;
  font-weight: 950;

  letter-spacing: .16em;
}

.shot-title {
  margin-top: 4px;

  font-size: 24px;
  line-height: 1;

  font-weight: 950;
  letter-spacing: -.055em;
}

.shot-sub {
  margin-top: 6px;

  color: #b2bdb5;

  font-size: 10px;
  line-height: 1.35;

  font-weight: 600;
}

/* =========================================================
   POCKETS
   ========================================================= */

.pocket-area {
  margin-top: 11px;
}

.label {
  margin-bottom: 6px;

  color: var(--muted);

  font-size: 7px;
  font-weight: 900;

  letter-spacing: .13em;
}

.pockets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.pocket {
  position: relative;

  height: 31px;

  border: 1px solid var(--border);
  border-radius: 8px;

  background: #101a14;

  color: #9aa69e;

  font-size: 7px;
  font-weight: 900;

  cursor: pointer;
}

.pocket.selected {
  color: white;

  border-color: var(--red);

  background:
    rgba(255, 65, 65, .14);

  box-shadow:
    inset 0 0 0 1px rgba(255, 65, 65, .08);
}

.pocket.suggested:not(.selected)::after {
  content: "BEST";

  position: absolute;

  top: 3px;
  right: 4px;

  color: var(--green);

  font-size: 5px;
  letter-spacing: .08em;
}

/* =========================================================
   AIM CARDS
   ========================================================= */

.aim-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;

  margin-top: 9px;
}

.aim-card {
  padding: 8px 5px;

  border-radius: 10px;

  background: #101a14;
  border: 1px solid var(--border);

  text-align: center;
}

.aim-label {
  margin-bottom: 6px;

  color: var(--muted);

  font-size: 7px;
  font-weight: 950;

  letter-spacing: .12em;
}

.aim-ball {
  position: relative;

  width: 66px;
  height: 66px;

  margin: 0 auto;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 32% 28%,
      #ffffff 0%,
      #f0f0ec 62%,
      #b6b6b1 100%
    );

  box-shadow:
    inset -7px -8px 12px rgba(0,0,0,.13),
    0 4px 10px rgba(0,0,0,.3);
}

.aim-ball.object {
  background:
    radial-gradient(
      circle at 32% 28%,
      #fff3af 0%,
      #eac348 62%,
      #a8750e 100%
    );
}

/*
  ONLY a dot.

  There is intentionally NO LINE.
*/

.aim-dot {
  position: absolute;

  width: 11px;
  height: 11px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: var(--red);

  border: 2px solid white;

  box-shadow:
    0 0 0 4px rgba(255,65,65,.18),
    0 0 12px rgba(255,65,65,.65);
}

.aim-text {
  margin-top: 6px;

  color: #d7ddd9;

  font-size: 8px;
  line-height: 1.15;

  font-weight: 850;
}

/* =========================================================
   RESET
   ========================================================= */

.reset {
  height: 40px;

  border-radius: 10px;

  background: var(--panel2);
  border: 1px solid var(--border);

  color: white;

  font-size: 9px;
  font-weight: 850;

  cursor: pointer;
}

.reset.active {
  color: var(--green);
  border-color: var(--green);
}

/* =========================================================
   EXPLANATION
   ========================================================= */

.more {
  border-radius: 12px;

  background: var(--panel);
  border: 1px solid var(--border);

  overflow: hidden;
}

.more summary {
  padding: 11px 12px;

  cursor: pointer;

  list-style: none;

  font-size: 9px;
  font-weight: 850;
}

.more summary::-webkit-details-marker {
  display: none;
}

.more-content {
  padding:
    0
    12px
    12px;

  color: var(--muted);

  font-size: 8px;
  line-height: 1.5;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 850px) {

  .layout {
    grid-template-columns: 1fr;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .ball-selector,
  .shot-card,
  .reset,
  .more {
    grid-column: 1 / -1;
  }

}

@media (max-width: 560px) {

  .app {
    padding: 7px;
  }

  .header {
    height: 43px;
    margin-bottom: 5px;
  }

  .brand-name {
    font-size: 19px;
  }

  .live {
    display: none;
  }

  .table-card {
    padding: 4px;
  }

  .controls {
    display: flex;
    gap: 7px;
  }

  .shot-title {
    font-size: 22px;
  }

  .aim-ball {
    width: 61px;
    height: 61px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        SC
      </div>

      <div>

        <div class="brand-name">
          Shot Caller
        </div>

        <div class="brand-sub">
          I’ll call the shot.
        </div>

      </div>

    </div>

    <div class="live">
      <span class="live-dot"></span>
      AUTO ANALYSIS
    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="layout">


    <!-- ===================================================
         TABLE
    ==================================================== -->

    <section class="table-card">

      <div class="table-wrap">

        <canvas id="table"></canvas>

      </div>

    </section>


    <!-- ===================================================
         CONTROLS
    ==================================================== -->

    <aside class="controls">


      <!-- BALL SELECTION -->

      <div class="ball-selector">

        <button
          type="button"
          class="ball-button selected"
          id="cueButton"
        >
          <span class="ball-icon cue"></span>
          Cue Ball
        </button>

        <button
          type="button"
          class="ball-button"
          id="objectButton"
        >
          <span class="ball-icon object"></span>
          Object Ball
        </button>

      </div>


      <!-- SHOT -->

      <section class="shot-card">

        <div class="kicker">
          SHOT CALL
        </div>

        <div
          class="shot-title"
          id="shotTitle"
        >
          I’LL CALL THE SHOT
        </div>

        <div
          class="shot-sub"
          id="shotSub"
        >
          Tap the table to place the cue ball.
        </div>


        <!-- POCKETS -->

        <div class="pocket-area">

          <div class="label">
            POCKET
          </div>

          <div class="pockets">

            <button
              type="button"
              class="pocket"
              data-pocket="TL"
            >
              TOP LEFT
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="TM"
            >
              TOP
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="TR"
            >
              TOP RIGHT
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="BL"
            >
              BOTTOM LEFT
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="BM"
            >
              BOTTOM
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="BR"
            >
              BOTTOM RIGHT
            </button>

          </div>

        </div>


        <!-- AIMING -->

        <div class="aim-grid">

          <div class="aim-card">

            <div class="aim-label">
              CUE BALL
            </div>

            <div class="aim-ball">

              <div
                class="aim-dot"
                id="cueAimDot"
              ></div>

            </div>

            <div
              class="aim-text"
              id="cueAimText"
            >
              Hit the red dot
            </div>

          </div>


          <div class="aim-card">

            <div class="aim-label">
              OBJECT BALL
            </div>

            <div class="aim-ball object">

              <div
                class="aim-dot"
                id="objectAimDot"
              ></div>

            </div>

            <div
              class="aim-text"
              id="objectAimText"
            >
              Aim at the red dot
            </div>

          </div>

        </div>

      </section>


      <!-- RESET -->

      <button
        type="button"
        class="reset"
        id="resetButton"
      >
        Reset Positions
      </button>


      <!-- DETAILS -->

      <details class="more">

        <summary>
          Why this shot?
        </summary>

        <div
          class="more-content"
          id="whyText"
        >
          Move the balls around the table and Shot Caller
          will automatically analyze the available routes.
        </div>

      </details>

    </aside>

  </main>

</div>


<script>
"use strict";

/* =========================================================
   SHOT CALLER ENGINE
   =========================================================

   IMPORTANT DESIGN DECISIONS

   1. Canvas has a permanent internal coordinate system:
        1000 x 500

   2. CSS only controls how large it appears.

   3. Balls are placed by tapping OR dragging.

   4. Shot Caller evaluates:
        - direct cut
        - one-rail bank
        - one-rail kick

   5. If the user chooses a pocket, that pocket is used.

   6. Otherwise Shot Caller chooses the best available pocket.

   7. Bank paths ALWAYS terminate at the selected pocket.

   8. No angles/degrees are exposed to the player.
*/


/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("table");

const ctx =
  canvas.getContext("2d", {
    alpha: false
  });

const cueButton =
  document.getElementById("cueButton");

const objectButton =
  document.getElementById("objectButton");

const resetButton =
  document.getElementById("resetButton");

const shotTitle =
  document.getElementById("shotTitle");

const shotSub =
  document.getElementById("shotSub");

const whyText =
  document.getElementById("whyText");

const cueAimDot =
  document.getElementById("cueAimDot");

const objectAimDot =
  document.getElementById("objectAimDot");

const cueAimText =
  document.getElementById("cueAimText");

const objectAimText =
  document.getElementById("objectAimText");

const pocketButtons =
  Array.from(
    document.querySelectorAll(".pocket")
  );


/* =========================================================
   PERMANENT WORLD COORDINATES
========================================================= */

const WORLD = {
  width: 1000,
  height: 500
};


/* =========================================================
   TABLE GEOMETRY
========================================================= */

const TABLE = {

  left: 56,
  right: 944,

  top: 56,
  bottom: 444,

  ballRadius: 14,

  pocketRadius: 27

};


/* =========================================================
   STATE
========================================================= */

const state = {

  selectedBall: "cue",

  cue: {
    x: 255,
    y: 325
  },

  object: {
    x: 610,
    y: 225
  },

  selectedPocket: null,

  suggestedPocket: null,

  shot: null,

  dragging: null

};


/* =========================================================
   POCKETS
========================================================= */

const pockets = [

  {
    id: "TL",
    name: "TOP LEFT",
    x: TABLE.left,
    y: TABLE.top
  },

  {
    id: "TM",
    name: "TOP",
    x: (TABLE.left + TABLE.right) / 2,
    y: TABLE.top
  },

  {
    id: "TR",
    name: "TOP RIGHT",
    x: TABLE.right,
    y: TABLE.top
  },

  {
    id: "BL",
    name: "BOTTOM LEFT",
    x: TABLE.left,
    y: TABLE.bottom
  },

  {
    id: "BM",
    name: "BOTTOM",
    x: (TABLE.left + TABLE.right) / 2,
    y: TABLE.bottom
  },

  {
    id: "BR",
    name: "BOTTOM RIGHT",
    x: TABLE.right,
    y: TABLE.bottom
  }

];


/* =========================================================
   BASIC MATH
========================================================= */

function add(a, b) {

  return {
    x: a.x + b.x,
    y: a.y + b.y
  };

}


function subtract(a, b) {

  return {
    x: a.x - b.x,
    y: a.y - b.y
  };

}


function multiply(a, n) {

  return {
    x: a.x * n,
    y: a.y * n
  };

}


function length(v) {

  return Math.hypot(
    v.x,
    v.y
  );

}


function normalize(v) {

  const l = length(v);

  if (l < 0.000001) {

    return {
      x: 0,
      y: 0
    };

  }

  return {
    x: v.x / l,
    y: v.y / l
  };

}


function distance(a, b) {

  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );

}


function dot(a, b) {

  return (
    a.x * b.x +
    a.y * b.y
  );

}


function clamp(value, min, max) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


/* =========================================================
   CANVAS SETUP
========================================================= */

function resizeCanvas() {

  /*
    The internal drawing area NEVER depends on CSS pixels.

    This is the important fix for the blank-table bug.
  */

  const dpr =
    Math.max(
      1,
      Math.min(
        window.devicePixelRatio || 1,
        3
      )
    );

  canvas.width =
    WORLD.width * dpr;

  canvas.height =
    WORLD.height * dpr;

  /*
    CSS dimensions remain 100% x 100%.
  */

  canvas.style.width = "100%";
  canvas.style.height = "100%";

  /*
    Everything below can now be drawn using the same
    1000 x 500 coordinate system on every device.
  */

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  draw();

}


/* =========================================================
   SCREEN → WORLD
========================================================= */

function pointerToWorld(event) {

  const rect =
    canvas.getBoundingClientRect();

  const x =
    (
      event.clientX -
      rect.left
    ) *
    WORLD.width /
    rect.width;

  const y =
    (
      event.clientY -
      rect.top
    ) *
    WORLD.height /
    rect.height;

  return {
    x,
    y
  };

}


/* =========================================================
   BALL HIT TEST
========================================================= */

function ballAt(point) {

  const objectDistance =
    distance(
      point,
      state.object
    );

  const cueDistance =
    distance(
      point,
      state.cue
    );

  const hitRadius =
    TABLE.ballRadius * 2.0;

  if (
    cueDistance <= hitRadius &&
    cueDistance <= objectDistance
  ) {

    return "cue";

  }

  if (
    objectDistance <= hitRadius
  ) {

    return "object";

  }

  return null;

}


/* =========================================================
   BALL PLACEMENT
========================================================= */

function placeSelectedBall(point) {

  const selected =
    state.selectedBall;

  const other =
    selected === "cue"
      ? state.object
      : state.cue;

  const ball =
    selected === "cue"
      ? state.cue
      : state.object;

  ball.x =
    clamp(
      point.x,
      TABLE.left + TABLE.ballRadius,
      TABLE.right - TABLE.ballRadius
    );

  ball.y =
    clamp(
      point.y,
      TABLE.top + TABLE.ballRadius,
      TABLE.bottom - TABLE.ballRadius
    );


  /*
    Keep the two balls physically separate.
  */

  const minimumDistance =
    TABLE.ballRadius * 2.15;

  const separation =
    distance(
      ball,
      other
    );

  if (
    separation < minimumDistance
  ) {

    let direction =
      normalize(
        subtract(
          ball,
          other
        )
      );

    if (
      direction.x === 0 &&
      direction.y === 0
    ) {

      direction = {
        x: 1,
        y: 0
      };

    }

    ball.x =
      other.x +
      direction.x *
      minimumDistance;

    ball.y =
      other.y +
      direction.y *
      minimumDistance;


    ball.x =
      clamp(
        ball.x,
        TABLE.left + TABLE.ballRadius,
        TABLE.right - TABLE.ballRadius
      );

    ball.y =
      clamp(
        ball.y,
        TABLE.top + TABLE.ballRadius,
        TABLE.bottom - TABLE.ballRadius
      );

  }

}


/* =========================================================
   POINTER INTERACTION
   ========================================================= */

canvas.addEventListener(
  "pointerdown",
  function(event) {

    event.preventDefault();

    const point =
      pointerToWorld(event);

    /*
      If the user touches an existing ball,
      grab that actual ball.

      Otherwise place whichever ball is selected.
    */

    const touched =
      ballAt(point);

    if (touched) {

      state.dragging = touched;

    } else {

      state.dragging =
        state.selectedBall;

      placeSelectedBall(point);

      analyze();
      draw();

    }

    try {

      canvas.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointermove",
  function(event) {

    if (!state.dragging) {
      return;
    }

    event.preventDefault();

    const point =
      pointerToWorld(event);

    state.selectedBall =
      state.dragging;

    updateBallButtons();

    placeSelectedBall(point);

    analyze();
    draw();

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointerup",
  function(event) {

    event.preventDefault();

    state.dragging = null;

    try {

      canvas.releasePointerCapture(
        event.pointerId
      );

    } catch (_) {}

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointercancel",
  function() {

    state.dragging = null;

  }
);

   BALL BUTTONS

function updateBallButtons() {

  );

  );

cueButton.addEventListener(

/* =========================================================
   POCKET SELECTION
========================================================= */

pocketButtons.forEach(
  function(button) {

    button.addEventListener(
      "click",
      function() {

        const id =
          button.dataset.pocket;

        /*
          Tap again to return to automatic pocket

        */

        ) {

        } else {

          state.selectedPocket = id;

        }

        analyze();
        draw();

      }
    );

  }
);


/* =========================================================
   POCKET LOOKUP
========================================================= */

function pocketById(id) {

  return pockets.find(
    function(pocket) {
      return pocket.id === id;
    }
  ) || null;

}


/* =========================================================
   LINE / SEGMENT DISTANCE
========================================================= */

function pointToSegmentDistance(
  point,
  start,
  end
) {

  const segment =
    subtract(
      end,
      start
    );

  const segmentLengthSquared =
    dot(
      segment,
      segment
    );

  if (
    segmentLengthSquared <
    0.000001
  ) {

    return distance(
      point,
      start
    );

  }

  const t =
    clamp(
      dot(
        subtract(
          point,
          start
        ),
        segment
      ) /
      segmentLengthSquared,
      0,
      1
    );

  const closest =
    add(
      start,
      multiply(
        segment,
        t
      )
    );

  return distance(
    point,
    closest
  );

}


/* =========================================================
   ROUTE BLOCKING
========================================================= */

function routeBlocked(
  start,
  end,
  ignored
) {

  const ignoredSet =
    new Set(
      ignored || []
    );

  const objects = [

    {
      id: "cue",
      point: state.cue
    },

    {
      id: "object",
      point: state.object
    }

  ];

  /*
    Conservative clearance.

    This is intentionally larger than a single ball radius
    because a beginner should not be shown routes that
    visually clip through another ball.
  */

  const clearance =
    TABLE.ballRadius * 2.05;

  for (
    const item of objects
  ) {

    if (
      ignoredSet.has(item.id)
    ) {

      continue;

    }

    if (
      pointToSegmentDistance(
        item.point,
        start,
        end
      ) < clearance
    ) {

      return true;

    }

  }

  return false;

}


/* =========================================================
   GHOST BALL
========================================================= */

function calculateGhostBall(
  object,
  destination
) {

  const direction =
    normalize(
      subtract(
        destination,
        object
      )
    );

  return add(
    object,
    multiply(
      direction,
      -TABLE.ballRadius * 2
    )
  );

}


/* =========================================================
   DIRECT CUT
========================================================= */

function calculateCut(
  pocket
) {

  const cue =
    state.cue;

  const object =
    state.object;

  /*
    Object ball's intended travel direction.
  */

  const objectDirection =
    normalize(
      subtract(
        pocket,
        object
      )
    );

  if (
    length(objectDirection) < 0.000001
  ) {

    return null;

  }


  /*
    Correct ghost-ball position.

    The cue ball contacts the object ball from
    the opposite side of its travel direction.
  */

  const ghost =
    calculateGhostBall(
      object,
      pocket
    );


  /*
    Ghost ball must remain on the table.
  */

  if (
    ghost.x <
      TABLE.left + TABLE.ballRadius ||
    ghost.x >
      TABLE.right - TABLE.ballRadius ||
    ghost.y <
      TABLE.top + TABLE.ballRadius ||
    ghost.y >
      TABLE.bottom - TABLE.ballRadius
  ) {

    return null;

  }


  /*
    Object → pocket must be clear.
  */

  if (
    routeBlocked(
      object,
      pocket,
      ["object"]
    )
  ) {

    return null;

  }


  /*
    Cue → ghost must be clear.
  */

  if (
    routeBlocked(
      cue,
      ghost,
      ["cue", "object"]
    )
  ) {

    return null;

  }


  const cueDirection =
    normalize(
      subtract(
        ghost,
        cue
      )
    );


  const alignment =
    clamp(
      dot(
        cueDirection,
        objectDirection
      ),
      -1,
      1
    );


  /*
    Internal difficulty measure.

    NEVER shown to the user.
  */

  const cutSeverity =
    1 - alignment;


  const cueDistance =
    distance(
      cue,
      ghost
    );

  const objectDistance =
    distance(
      object,
      pocket
    );


  /*
    Direct shots should normally beat an unnecessary
    bank, but very severe cuts become less desirable.
  */

  const score =
    cueDistance * 0.50 +
    objectDistance * 0.55 +
    cutSeverity * 150;


  return {

    type: "CUT",

    pocket,

    ghost,

    cuePath: [
      cue,
      ghost
    ],

    objectPath: [
      object,
      pocket
    ],

    score

  };

}


/* =========================================================
   REFLECTION
========================================================= */

function reflectAcrossRail(
  point,
  rail
) {

  if (rail === "left") {

    return {
      x:
        2 * TABLE.left -
        point.x,

      y:
        point.y
    };

  }

  if (rail === "right") {

    return {
      x:
        2 * TABLE.right -
        point.x,

      y:
        point.y
    };

  }

  if (rail === "top") {

    return {
      x:
        point.x,

      y:
        2 * TABLE.top -
        point.y
    };

  }

  return {

    x:
      point.x,

    y:
      2 * TABLE.bottom -
      point.y

  };

}


/* =========================================================
   RAIL INTERSECTION
========================================================= */

function lineRailIntersection(
  start,
  end,
  rail
) {

  const dx =
    end.x - start.x;

  const dy =
    end.y - start.y;


  /*
    LEFT / RIGHT
  */

  if (
    rail === "left" ||
    rail === "right"
  ) {

    if (
      Math.abs(dx) < 0.000001
    ) {

      return null;

    }

    const x =
      rail === "left"
        ? TABLE.left
        : TABLE.right;

    const t =
      (x - start.x) / dx;

    if (
      t <= 0 ||
      t >= 1
    ) {

      return null;

    }

    const y =
      start.y +
      dy * t;

    if (
      y <
        TABLE.top +
        TABLE.ballRadius * 1.3 ||
      y >
        TABLE.bottom -
        TABLE.ballRadius * 1.3
    ) {

      return null;

    }

    return {
      x,
      y
    };

  }


  /*
    TOP / BOTTOM
  */

  if (
    Math.abs(dy) < 0.000001
  ) {

    return null;

  }

  const y =
    rail === "top"
      ? TABLE.top
      : TABLE.bottom;

  const t =
    (y - start.y) / dy;

  if (
    t <= 0 ||
    t >= 1
  ) {

    return null;

  }

  const x =
    start.x +
    dx * t;

  if (
    x <
      TABLE.left +
      TABLE.ballRadius * 1.3 ||
    x >
      TABLE.right -
      TABLE.ballRadius * 1.3
  ) {

    return null;

  }

  return {
    x,
    y
  };

}


/* =========================================================
   ONE-RAIL BANK
   =========================================================

   IMPORTANT:

   This is not a fake arrow pointing somewhere arbitrary.

   For every rail:

      1. Reflect the ACTUAL pocket.
      2. Draw object → reflected pocket.
      3. Find the rail intersection.
      4. Draw object → rail → ACTUAL pocket.

   Therefore the displayed route ends at the actual
   pocket the user selected.
*/

function calculateBank(
  pocket
) {

  const cue =
    state.cue;

  const object =
    state.object;

  const rails = [
    "left",
    "right",
    "top",
    "bottom"
  ];

  let best = null;


  for (
    const rail of rails
  ) {

    /*
      Reflect the REAL destination pocket.
    */

    const reflectedPocket =
      reflectAcrossRail(
        pocket,
        rail
      );


    /*
      Find where object → reflected pocket
      crosses the physical rail.
    */

    const bankPoint =
      lineRailIntersection(
        object,
        reflectedPocket,
        rail
      );


    if (!bankPoint) {
      continue;
    }


    /*
      Object → rail must be clear.
    */

    if (
      routeBlocked(
        object,
        bankPoint,
        ["object", "cue"]
      )
    ) {

      continue;

    }


    /*
      Rail → ACTUAL POCKET must be clear.
    */

    if (
      routeBlocked(
        bankPoint,
        pocket,
        ["object", "cue"]
      )
    ) {

      continue;

    }


    /*
      Calculate the cue-ball ghost point.

      The cue ball has to hit the object ball in the
      direction that sends it toward the bank point.
    */

    const ghost =
      calculateGhostBall(
        object,
        bankPoint
      );


    if (
      ghost.x <
        TABLE.left + TABLE.ballRadius ||
      ghost.x >
        TABLE.right - TABLE.ballRadius ||
      ghost.y <
        TABLE.top + TABLE.ballRadius ||
      ghost.y >
        TABLE.bottom - TABLE.ballRadius
    ) {

      continue;

    }


    /*
      Cue → ghost must be clear.
    */

    if (
      routeBlocked(
        cue,
        ghost,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    /*
      Physical route length.
    */

    const cueDistance =
      distance(
        cue,
        ghost
      );

    const bankDistance =
      distance(
        object,
        bankPoint
      ) +
      distance(
        bankPoint,
        pocket
      );


    /*
      Banks receive a reasonable preference when
      they're clean and geometrically valid.

      This prevents the system from constantly choosing
      an ugly cut when a useful bank is available,
      while still allowing a very easy direct shot to win.
    */

    const score =
      cueDistance * 0.45 +
      bankDistance * 0.48 +
      35;


    const candidate = {

      type: "BANK",

      pocket,

      rail,

      bankPoint,

      ghost,

      cuePath: [
        cue,
        ghost
      ],

      objectPath: [
        object,
        bankPoint,
        pocket
      ],

      score

    };


    if (
      !best ||
      candidate.score < best.score
    ) {

      best = candidate;

    }

  }


  return best;

}


/* =========================================================
   ONE-RAIL KICK
========================================================= */

function calculateKick(
  pocket
) {

  const cue =
    state.cue;

  const object =
    state.object;

  const rails = [
    "left",
    "right",
    "top",
    "bottom"
  ];

  let best = null;


  for (
    const rail of rails
  ) {

    /*
      Reflect the object ball across the rail.

      This creates the virtual target needed to calculate
      a one-rail cue-ball route.
    */

    const reflectedObject =
      reflectAcrossRail(
        object,
        rail
      );


    const railPoint =
      lineRailIntersection(
        cue,
        reflectedObject,
        rail
      );


    if (!railPoint) {
      continue;
    }


    /*
      Cue → rail.
    */

    if (
      routeBlocked(
        cue,
        railPoint,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    /*
      Rail → object.
    */

    if (
      routeBlocked(
        railPoint,
        object,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    /*
      Object → pocket.
    */

    if (
      routeBlocked(
        object,
        pocket,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    const score =
      distance(
        cue,
        railPoint
      ) * .45 +
      distance(
        railPoint,
        object
      ) * .45 +
      distance(
        object,
        pocket
      ) * .40 +
      180;


    const candidate = {

      type: "KICK",

      pocket,

      rail,

      kickPoint: railPoint,

      cuePath: [
        cue,
        railPoint,
        object
      ],

      objectPath: [
        object,
        pocket
      ],

      score

    };


    if (
      !best ||
      candidate.score < best.score
    ) {

      best = candidate;

    }

  }


  return best;

}


/* =========================================================
   VALIDATE SHOT
========================================================= */

function validShot(
  shot
) {

  if (!shot) {
    return false;
  }

  if (!shot.pocket) {
    return false;
  }

  if (
    !shot.objectPath ||
    shot.objectPath.length < 2
  ) {

    return false;

  }

  /*
    The FINAL object path point must be the
    ACTUAL selected pocket.
  */

  const finalPoint =
    shot.objectPath[
      shot.objectPath.length - 1
    ];

  if (
    distance(
      finalPoint,
      shot.pocket
    ) > 0.01
  ) {

    return false;

  }


  /*
    A bank MUST be object → rail → pocket.
  */

  if (
    shot.type === "BANK"
  ) {

    if (
      shot.objectPath.length !== 3 ||
      !shot.bankPoint
    ) {

      return false;

    }

  }

  return true;

}


/* =========================================================
   ALL SHOTS FOR ONE POCKET
========================================================= */

function shotsForPocket(
  pocket
) {

  const candidates = [];


  const cut =
    calculateCut(
      pocket
    );

  if (
    validShot(cut)
  ) {

    candidates.push(cut);

  }


  const bank =
    calculateBank(
      pocket
    );

  if (
    validShot(bank)
  ) {

    candidates.push(bank);

  }


  const kick =
    calculateKick(
      pocket
    );

  if (
    validShot(kick)
  ) {

    candidates.push(kick);

  }


  return candidates;

}


/* =========================================================
   ANALYZE
========================================================= */

function analyze() {

  let candidates = [];


  /*
    Manual pocket:
    only analyze that pocket.
  */

  if (
    state.selectedPocket
  ) {

    const pocket =
      pocketById(
        state.selectedPocket
      );

    if (pocket) {

      candidates =
        shotsForPocket(
          pocket
        );

    }

  }

  /*
    Automatic:
    analyze all six pockets.
  */

  else {

    for (
      const pocket of pockets
    ) {

      candidates.push(
        ...shotsForPocket(
          pocket
        )
      );

    }

  }


  /*
    Nothing available.
  */

  if (
    candidates.length === 0
  ) {

    state.shot = null;

    state.suggestedPocket = null;

    updatePocketUI();
    updateShotUI();

    return;

  }


  /*
    Lowest score wins.
  */

  candidates.sort(
    function(a, b) {
      return a.score - b.score;
    }
  );


  state.shot =
    candidates[0];

  state.suggestedPocket =
    state.shot.pocket.id;


  updatePocketUI();
  updateShotUI();

}


/* =========================================================
   POCKET UI
========================================================= */

function updatePocketUI() {

  pocketButtons.forEach(
    function(button) {

      const id =
        button.dataset.pocket;

      button.classList.toggle(
        "selected",
        state.selectedPocket === id
      );

      button.classList.toggle(
        "suggested",
        state.selectedPocket === null &&
        state.suggestedPocket === id
      );

    }
  );

}


/* =========================================================
   AIM DOT
========================================================= */

function setAimDot(
  element,
  origin,
  target
) {

  const direction =
    normalize(
      subtract(
        target,
        origin
      )
    );


  /*
    The enlarged ball uses a visual radius of roughly
    31% of its diameter.

    Only the dot is displayed.
  */

  const x =
    clamp(
      50 + direction.x * 31,
      9,
      91
    );

  const y =
    clamp(
      50 + direction.y * 31,
      9,
      91
    );


  element.style.left =
    `${x}%`;

  element.style.top =
    `${y}%`;

}


/* =========================================================
   SHOT UI
========================================================= */

function updateShotUI() {

  const shot =
    state.shot;


  if (!shot) {

    shotTitle.textContent =
      "NO CLEAR SHOT";

    shotSub.textContent =
      "Try moving the balls or choosing another pocket.";

    cueAimText.textContent =
      "No clear route";

    objectAimText.textContent =
      "No clear route";

    whyText.textContent =
      "Shot Caller could not find a sufficiently clear direct, bank, or kick route to the selected pocket.";

    return;

  }


  /* =======================================================
     BANK
  ======================================================= */

  if (
    shot.type === "BANK"
  ) {

    shotTitle.textContent =
      `BANK → ${shot.pocket.name}`;

    shotSub.textContent =
      "One rail. Follow the green path.";

    cueAimText.textContent =
      "Hit the red dot";

    objectAimText.textContent =
      "Send it to the rail";


    setAimDot(
      cueAimDot,
      state.cue,
      shot.ghost
    );


    setAimDot(
      objectAimDot,
      state.object,
      shot.bankPoint
    );


    whyText.textContent =
      `Shot Caller found a one-rail bank using the ${shot.rail} rail. The blue mark on the table is the calculated rail contact point, and the green route continues from that point into the ${shot.pocket.name.toLowerCase()} pocket.`;

    return;

  }


  /* =======================================================
     KICK
  ======================================================= */

  if (
    shot.type === "KICK"
  ) {

    shotTitle.textContent =
      `KICK → ${shot.pocket.name}`;

    shotSub.textContent =
      "One rail to the object ball.";

    cueAimText.textContent =
      "Hit the red dot";

    objectAimText.textContent =
      "Send it to the pocket";


    setAimDot(
      cueAimDot,
      state.cue,
      shot.kickPoint
    );


    setAimDot(
      objectAimDot,
      state.object,
      shot.pocket
    );


    whyText.textContent =
      `Shot Caller selected a one-rail kick using the ${shot.rail} rail. The cue ball reaches the rail first, then the object ball, which is directed toward the ${shot.pocket.name.toLowerCase()} pocket.`;

    return;

  }


  /* =======================================================
     CUT
  ======================================================= */

  shotTitle.textContent =
    `CUT → ${shot.pocket.name}`;

  shotSub.textContent =
    "Direct route.";

  cueAimText.textContent =
    "Hit the red dot";

  objectAimText.textContent =
    "Send it to the pocket";


  setAimDot(
    cueAimDot,
    state.cue,
    shot.ghost
  );


  setAimDot(
    objectAimDot,
    state.object,
    shot.pocket
  );


  whyText.textContent =
    `Shot Caller found a clear direct route to the ${shot.pocket.name.toLowerCase()} pocket, so no rail is required.`;

}


/* =========================================================
   DRAWING HELPERS
========================================================= */

function roundedRect(
  x,
  y,
  width,
  height,
  radius
) {

  const r =
    Math.min(
      radius,
      width / 2,
      height / 2
    );

  ctx.beginPath();

  ctx.moveTo(
    x + r,
    y
  );

  ctx.arcTo(
    x + width,
    y,
    x + width,
    y + height,
    r
  );

  ctx.arcTo(
    x + width,
    y + height,
    x,
    y + height,
    r
  );

  ctx.arcTo(
    x,
    y + height,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x + width,
    y,
    r
  );

  ctx.closePath();

}


/* =========================================================
   DRAW TABLE
========================================================= */

function drawTable() {

  /*
    Because the canvas transform is always dpr-scaled,
    our coordinates below are always 1000 x 500.
  */

  ctx.clearRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );


  /* OUTER TABLE */

  ctx.fillStyle =
    "#1b1009";

  roundedRect(
    0,
    0,
    WORLD.width,
    WORLD.height,
    25
  );

  ctx.fill();


  /* WOOD RAIL */

  ctx.fillStyle =
    "#4a2d1c";

  roundedRect(
    12,
    12,
    WORLD.width - 24,
    WORLD.height - 24,
    19
  );

  ctx.fill();


  /* RAIL HIGHLIGHT */

  ctx.strokeStyle =
    "#684329";

  ctx.lineWidth = 3;

  roundedRect(
    24,
    24,
    WORLD.width - 48,
    WORLD.height - 48,
    15
  );

  ctx.stroke();


  /* FELT */

  const feltGradient =
    ctx.createLinearGradient(
      TABLE.left,
      TABLE.top,
      TABLE.right,
      TABLE.bottom
    );

  feltGradient.addColorStop(
    0,
    "#16764b"
  );

  feltGradient.addColorStop(
    .5,
    "#126d45"
  );

  feltGradient.addColorStop(
    1,
    "#0e5d3c"
  );

  ctx.fillStyle =
    feltGradient;

  roundedRect(
    TABLE.left,
    TABLE.top,
    TABLE.right - TABLE.left,
    TABLE.bottom - TABLE.top,
    8
  );

  ctx.fill();


  /* SUBTLE FELT SHADOW */

  const shade =
    ctx.createLinearGradient(
      TABLE.left,
      TABLE.top,
      TABLE.right,
      TABLE.bottom
    );

  shade.addColorStop(
    0,
    "rgba(255,255,255,.035)"
  );

  shade.addColorStop(
    .55,
    "rgba(0,0,0,0)"
  );

  shade.addColorStop(
    1,
    "rgba(0,0,0,.10)"
  );

  ctx.fillStyle =
    shade;

  roundedRect(
    TABLE.left,
    TABLE.top,
    TABLE.right - TABLE.left,
    TABLE.bottom - TABLE.top,
    8
  );

  ctx.fill();


  drawDiamonds();

  pockets.forEach(
    drawPocket
  );

}


/* =========================================================
   DIAMONDS
========================================================= */

function drawDiamond(
  x,
  y
) {

  ctx.beginPath();

  ctx.moveTo(
    x,
    y - 5
  );

  ctx.lineTo(
    x + 5,
    y
  );

  ctx.lineTo(
    x,
    y + 5
  );

  ctx.lineTo(
    x - 5,
    y
  );

  ctx.closePath();

  ctx.fillStyle =
    "#e1c995";

  ctx.fill();

}


function drawDiamonds() {

  const horizontal = [
    .125,
    .25,
    .375,
    .625,
    .75,
    .875
  ];

  horizontal.forEach(
    function(ratio) {

      const x =
        TABLE.left +
        (
          TABLE.right -
          TABLE.left
        ) *
        ratio;

      drawDiamond(
        x,
        TABLE.top - 17
      );

      drawDiamond(
        x,
        TABLE.bottom + 17
      );

    }
  );


  [.25, .5, .75].forEach(
    function(ratio) {

      const y =
        TABLE.top +
        (
          TABLE.bottom -
          TABLE.top
        ) *
        ratio;

      drawDiamond(
        TABLE.left - 17,
        y
      );

      drawDiamond(
        TABLE.right + 17,
        y
      );

    }
  );

}


/* =========================================================
   POCKETS
========================================================= */

function drawPocket(
  pocket
) {

  /*
    Pocket center is exactly the same coordinate used
    by the shot calculation.

    No visual offset.
  */

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocketRadius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#020403";

  ctx.fill();


  ctx.strokeStyle =
    "rgba(255,255,255,.07)";

  ctx.lineWidth = 2;

  ctx.stroke();

}


/* =========================================================
   SELECTED / SUGGESTED POCKET
========================================================= */

function drawPocketTarget(
  pocket
) {

  ctx.save();


  /*
    Outer red glow.
  */

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocketRadius + 13,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "rgba(255,65,65,.22)";

  ctx.lineWidth = 5;

  ctx.shadowColor =
    "rgba(255,65,65,.60)";

  ctx.shadowBlur = 15;

  ctx.stroke();


  /*
    Main ring.
  */

  ctx.shadowBlur = 0;

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocketRadius + 8,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "#ff4141";

  ctx.lineWidth = 3;

  ctx.stroke();


  /*
    Center.
  */

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    4,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ff4141";

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   ROUTE
========================================================= */

function drawRoute(
  points,
  color,
  width,
  dashed
) {

  if (
    !points ||
    points.length < 2
  ) {

    return;

  }


  ctx.save();

  ctx.strokeStyle =
    color;

  ctx.lineWidth =
    width;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  if (dashed) {

    ctx.setLineDash([
      10,
      9
    ]);

  } else {

    ctx.setLineDash([]);

  }


  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );


  for (
    let i = 1;
    i < points.length;
    i++
  ) {

    ctx.lineTo(
      points[i].x,
      points[i].y
    );

  }


  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   ROUTE ARROW
========================================================= */

function drawArrow(
  from,
  to,
  color
) {

  const direction =
    normalize(
      subtract(
        to,
        from
      )
    );

  if (
    length(direction) < 0.001
  ) {

    return;

  }


  const perpendicular = {
    x: -direction.y,
    y: direction.x
  };


  const size = 13;


  const left =
    add(
      to,
      add(
        multiply(
          direction,
          -size
        ),
        multiply(
          perpendicular,
          size * .55
        )
      )
    );


  const right =
    add(
      to,
      add(
        multiply(
          direction,
          -size
        ),
        multiply(
          perpendicular,
          -size * .55
        )
      )
    );


  ctx.fillStyle =
    color;

  ctx.beginPath();

  ctx.moveTo(
    to.x,
    to.y
  );

  ctx.lineTo(
    left.x,
    left.y
  );

  ctx.lineTo(
    right.x,
    right.y
  );

  ctx.closePath();

  ctx.fill();

}


/* =========================================================
   TARGET POINT
========================================================= */

function drawTarget(
  point,
  type
) {

  const color =
    type === "red"
      ? "#ff4141"
      : "#5ca9ff";

  ctx.save();


  ctx.beginPath();

  ctx.arc(
    point.x,
    point.y,
    14,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    type === "red"
      ? "rgba(255,65,65,.24)"
      : "rgba(92,169,255,.28)";

  ctx.lineWidth = 4;

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    point.x,
    point.y,
    7,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    color;

  ctx.fill();

  ctx.strokeStyle =
    "#ffffff";

  ctx.lineWidth = 2;

  ctx.stroke();


  ctx.restore();

}


/* =========================================================
   BALL
========================================================= */

function drawBall(
  ball,
  type,
  selected
) {

  const r =
    TABLE.ballRadius;


  /*
    Selection ring.
  */

  if (selected) {

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      r + 9,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "#39e47d";

    ctx.lineWidth = 3;

    ctx.shadowColor =
      "rgba(57,228,125,.60)";

    ctx.shadowBlur = 11;

    ctx.stroke();

    ctx.restore();

  }


  const gradient =
    type === "cue"
      ? ctx.createRadialGradient(
          ball.x - r * .4,
          ball.y - r * .4,
          1,
          ball.x,
          ball.y,
          r
        )
      : ctx.createRadialGradient(
          ball.x - r * .4,
          ball.y - r * .4,
          1,
          ball.x,
          ball.y,
          r
        );


  if (
    type === "cue"
  ) {

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .65,
      "#eeeeeb"
    );

    gradient.addColorStop(
      1,
      "#b5b5b0"
    );

  } else {

    gradient.addColorStop(
      0,
      "#fff2ad"
    );

    gradient.addColorStop(
      .65,
      "#eac348"
    );

    gradient.addColorStop(
      1,
      "#a7740e"
    );

  }


  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    r,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    gradient;

  ctx.fill();


  ctx.strokeStyle =
    "rgba(0,0,0,.55)";

  ctx.lineWidth = 1.5;

  ctx.stroke();

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

  /*
    IMPORTANT:
    Always reset the transform before drawing.

    This prevents accidental cumulative transforms.
  */

  const dpr =
    canvas.width / WORLD.width;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  drawTable();


  const shot =
    state.shot;


  if (shot) {

    /*
      Selected / suggested pocket.
    */

    drawPocketTarget(
      shot.pocket
    );


    /*
      Cue route.
    */

    drawRoute(
      shot.cuePath,
      "#f7f8f5",
      3,
      true
    );


    /*
      Object route.

      BANK:
        object → rail → actual pocket

      CUT:
        object → actual pocket
    */

    drawRoute(
      shot.objectPath,
      "#39e47d",
      5,
      false
    );


    /*
      Cue arrow.
    */

    if (
      shot.cuePath.length >= 2
    ) {

      const from =
        shot.cuePath[
          shot.cuePath.length - 2
        ];

      const to =
        shot.cuePath[
          shot.cuePath.length - 1
        ];

      drawArrow(
        from,
        to,
        "#f7f8f5"
      );

    }


    /*
      Object route final arrow.

      For a bank this is the rail → pocket
      portion, making the destination unmistakable.
    */

    if (
      shot.objectPath.length >= 2
    ) {

      const from =
        shot.objectPath[
          shot.objectPath.length - 2
        ];

      const to =
        shot.objectPath[
          shot.objectPath.length - 1
        ];

      drawArrow(
        from,
        to,
        "#39e47d"
      );

    }


    /*
      Ghost ball.
    */

    if (
      shot.ghost
    ) {

      drawTarget(
        shot.ghost,
        "blue"
      );

    }


    /*
      Bank rail contact.
    */

    if (
      shot.bankPoint
    ) {

      drawTarget(
        shot.bankPoint,
        "blue"
      );

    }


    /*
      Kick rail contact.
    */

    if (
      shot.kickPoint
    ) {

      drawTarget(
        shot.kickPoint,
        "blue"
      );

    }

  }


  /*
    Balls always appear ABOVE routes.
  */

  drawBall(
    state.cue,
    "cue",
    state.selectedBall === "cue"
  );


  drawBall(
    state.object,
    "object",
    state.selectedBall === "object"
  );

}


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
  "click",
  function() {

    state.cue = {
      x: 255,
      y: 325
    };

    state.object = {
      x: 610,
      y: 225
    };

    state.selectedBall = "cue";

    state.selectedPocket = null;

    state.suggestedPocket = null;

    state.dragging = null;

    updateBallButtons();

    resetButton.classList.add(
      "active"
    );

    setTimeout(
      function() {

        resetButton.classList.remove(
          "active"
        );

      },
      300
    );

    analyze();
    draw();

  }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   INITIALIZATION
========================================================= */

updateBallButtons();

analyze();

resizeCanvas();

</script>
