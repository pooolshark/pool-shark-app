<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07100b">
<title>Shot Caller</title>

<style>
:root{
  --bg:#07100b;
  --panel:#0e1812;
  --panel2:#121e16;
  --line:#26352b;
  --text:#f5f7f5;
  --muted:#93a098;
  --green:#35dc7b;
  --red:#ff4545;
  --blue:#58a8ff;
  --yellow:#f3ca55;
  --felt:#167548;
  --rail:#51321f;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:10px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 3px 9px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  width:37px;
  height:37px;
  border-radius:11px;
  background:var(--green);
  color:#061009;
  display:grid;
  place-items:center;
  font-weight:950;
  font-size:12px;
}

.title{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.045em;
}

.subtitle{
  font-size:10px;
  color:var(--muted);
  margin-top:1px;
}

.status{
  font-size:9px;
  font-weight:900;
  letter-spacing:.11em;
  color:var(--green);
}

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 255px;
  gap:10px;
}

.table-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:6px;
}

.table-wrap{
  position:relative;
  width:100%;
  border-radius:10px;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  touch-action:none;
}

.controls{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.ball-selector{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.ball-button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  min-height:49px;
  font-size:12px;
  font-weight:850;
  transition:.12s ease;
}

.ball-button.selected{
  border-color:var(--green);
  background:rgba(53,220,123,.12);
  color:var(--green);
  box-shadow:0 0 0 1px rgba(53,220,123,.12) inset;
}

.ball-button:active{
  transform:scale(.98);
}

.ball-dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  vertical-align:-1px;
  margin-right:5px;
}

.ball-dot.cue{
  background:#fff;
  box-shadow:0 0 0 1px #777;
}

.ball-dot.object{
  background:var(--yellow);
}

.recommendation{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
}

.rec-kicker{
  color:var(--green);
  font-size:9px;
  font-weight:950;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.rec-title{
  font-size:24px;
  line-height:1.02;
  font-weight:950;
  letter-spacing:-.045em;
  margin-top:5px;
}

.rec-sub{
  color:#bbc5bf;
  font-size:11px;
  line-height:1.35;
  margin-top:6px;
}

.visual-aim{
  margin-top:11px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.aim-card{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
  text-align:center;
}

.aim-label{
  color:var(--muted);
  font-size:8px;
  font-weight:900;
  letter-spacing:.08em;
  margin-bottom:5px;
}

.aim-ball{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:50%;
  position:relative;
  background:#fff;
  box-shadow:
    inset -8px -10px 14px rgba(0,0,0,.16),
    0 2px 8px rgba(0,0,0,.3);
}

.aim-ball.object{
  background:var(--yellow);
}

.aim-dot{
  width:11px;
  height:11px;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:var(--red);
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(255,69,69,.18);
}

.aim-line{
  position:absolute;
  height:2px;
  background:var(--red);
  transform-origin:left center;
  left:50%;
  top:50%;
  width:25px;
}

.tip{
  margin-top:8px;
  text-align:center;
  font-size:10px;
  font-weight:800;
  line-height:1.25;
}

.reset{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:11px;
  min-height:43px;
  font-size:11px;
  font-weight:850;
}

.reset.selected{
  border-color:var(--green);
  color:var(--green);
}

.more{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

.more summary{
  list-style:none;
  cursor:pointer;
  padding:12px 13px;
  font-size:11px;
  font-weight:850;
}

.more summary::-webkit-details-marker{
  display:none;
}

.more-content{
  padding:0 13px 13px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

@media(max-width:800px){
  .main{
    grid-template-columns:1fr;
  }

  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .ball-selector,
  .recommendation,
  .more{
    grid-column:1/-1;
  }

  .reset{
    grid-column:1/-1;
  }
}

@media(max-width:560px){
  .app{
    padding:7px;
  }

  header{
    padding-bottom:7px;
  }

  .title{
    font-size:19px;
  }

  .status{
    display:none;
  }

  .main{
    gap:7px;
  }

  .table-card{
    padding:4px;
  }

  .controls{
    display:flex;
  }

  .ball-selector{
    padding:6px;
  }

  .ball-button{
    min-height:45px;
  }

  .recommendation{
    padding:11px;
  }

  .rec-title{
    font-size:22px;
  }

  .aim-ball{
    width:62px;
    height:62px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo-area">
    <div class="logo">SC</div>
    <div>
      <div class="title">Shot Caller</div>
      <div class="subtitle">Set the balls. I'll call the shot.</div>
    </div>
  </div>

  <div class="status">AUTO ANALYSIS</div>
</header>

<div class="main">

  <section class="table-card">
    <div class="table-wrap">
      <canvas id="table"></canvas>
    </div>
  </section>

  <aside class="controls">

    <div class="ball-selector">

      <button class="ball-button selected" id="cueSelect">
        <span class="ball-dot cue"></span>
        Cue Ball
      </button>

      <button class="ball-button" id="objectSelect">
        <span class="ball-dot object"></span>
        Object Ball
      </button>

    </div>

    <section class="recommendation">

      <div class="rec-kicker">Shot Caller</div>

      <div class="rec-title" id="shotTitle">
        Set your balls
      </div>

      <div class="rec-sub" id="shotSub">
        Select a ball, then tap its location on the table.
      </div>

      <div class="visual-aim">

        <div class="aim-card">

          <div class="aim-label">CUE BALL</div>

          <div class="aim-ball" id="cueAim">
            <div class="aim-dot" id="cueDot"></div>
          </div>

          <div class="tip" id="cueTip">
            Set the cue ball
          </div>

        </div>

        <div class="aim-card">

          <div class="aim-label">OBJECT BALL</div>

          <div class="aim-ball object" id="objectAim">
            <div class="aim-dot" id="objectDot"></div>
          </div>

          <div class="tip" id="objectTip">
            Set the object ball
          </div>

        </div>

      </div>

    </section>

    <button class="reset" id="reset">
      Reset Positions
    </button>

    <details class="more">
      <summary>Why this shot?</summary>
      <div class="more-content" id="why">
        Shot analysis will appear here after both balls are positioned.
      </div>
    </details>

  </aside>

</div>

</div>

<script>
/* =========================================================
   SHOT CALLER
   Visual-first pool shot planner
   ========================================================= */

const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");

const cueSelect = document.getElementById("cueSelect");
const objectSelect = document.getElementById("objectSelect");
const resetButton = document.getElementById("reset");

const shotTitle = document.getElementById("shotTitle");
const shotSub = document.getElementById("shotSub");
const cueTip = document.getElementById("cueTip");
const objectTip = document.getElementById("objectTip");
const why = document.getElementById("why");

const cueDot = document.getElementById("cueDot");
const objectDot = document.getElementById("objectDot");

const TABLE = {
  width:1000,
  height:500,

  /*
    This is the playable surface.
  */
  left:54,
  right:946,
  top:54,
  bottom:446,

  ball:14,

  /*
    Slightly enlarged pocket opening for
    visual/aim purposes.
  */
  pocket:27
};

const pockets = [
  {
    id:"TL",
    x:TABLE.left,
    y:TABLE.top,
    label:"TOP LEFT"
  },
  {
    id:"TM",
    x:500,
    y:TABLE.top,
    label:"TOP MIDDLE"
  },
  {
    id:"TR",
    x:TABLE.right,
    y:TABLE.top,
    label:"TOP RIGHT"
  },
  {
    id:"BL",
    x:TABLE.left,
    y:TABLE.bottom,
    label:"BOTTOM LEFT"
  },
  {
    id:"BM",
    x:500,
    y:TABLE.bottom,
    label:"BOTTOM MIDDLE"
  },
  {
    id:"BR",
    x:TABLE.right,
    y:TABLE.bottom,
    label:"BOTTOM RIGHT"
  }
];

const state = {

  cue:{
    x:250,
    y:320
  },

  object:{
    x:590,
    y:245
  },

  selected:"cue",

  shot:null,

  dpr:window.devicePixelRatio || 1
};

/* =========================================================
   BASIC MATH
   ========================================================= */

function sub(a,b){
  return {
    x:a.x-b.x,
    y:a.y-b.y
  };
}

function add(a,b){
  return {
    x:a.x+b.x,
    y:a.y+b.y
  };
}

function mul(a,n){
  return {
    x:a.x*n,
    y:a.y*n
  };
}

function dot(a,b){
  return a.x*b.x+a.y*b.y;
}

function length(v){
  return Math.hypot(v.x,v.y);
}

function normalize(v){
  const l=length(v);

  if(l===0){
    return {x:0,y:0};
  }

  return {
    x:v.x/l,
    y:v.y/l
  };
}

function distance(a,b){
  return length(sub(a,b));
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

/* =========================================================
   BALL POSITIONING
   ========================================================= */

function selectBall(which){

  state.selected=which;

  cueSelect.classList.toggle(
    "selected",
    which==="cue"
  );

  objectSelect.classList.toggle(
    "selected",
    which==="object"
  );

  shotSub.textContent=
    which==="cue"
      ? "Tap the table where your cue ball is."
      : "Tap the table where your object ball is.";

  draw();
}

cueSelect.addEventListener(
  "click",
  ()=>{
    selectBall("cue");
  }
);

objectSelect.addEventListener(
  "click",
  ()=>{
    selectBall("object");
  }
);

resetButton.addEventListener(
  "click",
  ()=>{
    state.cue={
      x:250,
      y:320
    };

    state.object={
      x:590,
      y:245
    };

    state.selected="cue";

    resetButton.classList.add("selected");

    setTimeout(()=>{
      resetButton.classList.remove("selected");
    },350);

    selectBall("cue");
    analyze();
    draw();
  }
);

function canvasPoint(e){

  const rect=
    canvas.getBoundingClientRect();

  return {
    x:
      (e.clientX-rect.left)*
      TABLE.width/
      rect.width,

    y:
      (e.clientY-rect.top)*
      TABLE.height/
      rect.height
  };
}

function placeSelectedBall(point){

  const ball=
    state.selected==="cue"
      ? state.cue
      : state.object;

  ball.x=clamp(
    point.x,
    TABLE.left+TABLE.ball,
    TABLE.right-TABLE.ball
  );

  ball.y=clamp(
    point.y,
    TABLE.top+TABLE.ball,
    TABLE.bottom-TABLE.ball
  );

  /*
    Keep the balls from occupying the same space.
  */
  const other=
    state.selected==="cue"
      ? state.object
      : state.cue;

  const minDistance=
    TABLE.ball*2.2;

  if(distance(ball,other)<minDistance){

    const direction=
      normalize(
        sub(ball,other)
      );

    ball.x=
      other.x+
      direction.x*minDistance;

    ball.y=
      other.y+
      direction.y*minDistance;
  }
}

/*
  IMPORTANT:
  The primary interaction is TAP TO PLACE.

  No drag is required.
  No zoom is required.
  No tiny ball target is required.

  A tap anywhere on the table places whichever
  ball is currently selected.
*/
canvas.addEventListener(
  "pointerup",
  e=>{

    e.preventDefault();

    placeSelectedBall(
      canvasPoint(e)
    );

    analyze();
    draw();
  },
  {
    passive:false
  }
);

/* =========================================================
   POCKET GEOMETRY
   ========================================================= */

/*
  We use the effective pocket-entry point rather than
  blindly aiming the object-ball center at the visual
  center of every pocket.

  This keeps the route tied to the actual pocket.
*/

function pocketTarget(pocket){

  return {
    x:pocket.x,
    y:pocket.y
  };
}

/* =========================================================
   COLLISION / BLOCKING
   ========================================================= */

function pointSegmentDistance(p,a,b){

  const ab=sub(b,a);
  const ab2=dot(ab,ab);

  if(ab2===0){
    return distance(p,a);
  }

  const t=clamp(
    dot(sub(p,a),ab)/ab2,
    0,
    1
  );

  const closest=
    add(
      a,
      mul(ab,t)
    );

  return distance(
    p,
    closest
  );
}

function pathBlocked(
  a,
  b,
  ignore=[]
){

  const balls=[
    {
      id:"cue",
      p:state.cue
    },
    {
      id:"object",
      p:state.object
    }
  ];

  for(const ball of balls){

    if(ignore.includes(ball.id)){
      continue;
    }

    const clearance=
      TABLE.ball*2.15;

    if(
      pointSegmentDistance(
        ball.p,
        a,
        b
      )<clearance
    ){
      return true;
    }
  }

  return false;
}

/* =========================================================
   GHOST BALL
   ========================================================= */

function ghostForTarget(
  object,
  target
){

  const direction=
    normalize(
      sub(target,object)
    );

  /*
    Two ball radii gives the approximate center-to-center
    collision relationship for a rolling object ball.
  */
  return add(
    object,
    mul(
      direction,
      -TABLE.ball*2
    )
  );
}

/* =========================================================
   DIRECT SHOTS
   ========================================================= */

function directShot(pocket){

  const cue=state.cue;
  const object=state.object;
  const target=pocketTarget(pocket);

  const ghost=
    ghostForTarget(
      object,
      target
    );

  /*
    Ghost ball must remain on the playable table.
  */
  if(
    ghost.x<
      TABLE.left+TABLE.ball ||
    ghost.x>
      TABLE.right-TABLE.ball ||
    ghost.y<
      TABLE.top+TABLE.ball ||
    ghost.y>
      TABLE.bottom-TABLE.ball
  ){
    return null;
  }

  /*
    Object-ball route must actually reach the pocket.
  */
  if(
    pathBlocked(
      object,
      target,
      ["cue","object"]
    )
  ){
    return null;
  }

  /*
    Cue ball must actually reach the required
    ghost-ball position.
  */
  if(
    pathBlocked(
      cue,
      ghost,
      ["cue","object"]
    )
  ){
    return null;
  }

  const cueVector=
    normalize(
      sub(ghost,cue)
    );

  const objectVector=
    normalize(
      sub(target,object)
    );

  /*
    A straight-through relationship is easier.
    A sharp cut is progressively penalized.
  */
  const alignment=
    clamp(
      Math.abs(
        dot(
          cueVector,
          objectVector
        )
      ),
      0,
      1
    );

  const cutPenalty=
    (1-alignment)*300;

  const cueDistance=
    distance(
      cue,
      ghost
    );

  const objectDistance=
    distance(
      object,
      target
    );

  /*
    Slight preference for pockets that don't require
    extreme table travel.
  */
  const score=
    cueDistance*.75+
    objectDistance*.65+
    cutPenalty;

  return {
    type:"cut",
    pocket,
    target,
    ghost,
    cuePath:[cue,ghost],
    objectPath:[object,target],
    score,
    alignment
  };
}

/* =========================================================
   BANK SHOT GEOMETRY
   ========================================================= */

/*
  A real one-rail bank is solved by reflecting the TARGET
  across the selected rail.

  Then we draw the line from the object ball to that
  reflected target. The intersection with the rail is
  the bank contact point.

  Crucially, the reflected route is then converted back
  into the actual physical route:

  OBJECT -> RAIL CONTACT -> POCKET

  The displayed line therefore terminates at the actual
  selected pocket.
*/

function reflectedPoint(
  point,
  rail
){

  if(rail==="left"){
    return {
      x:2*TABLE.left-point.x,
      y:point.y
    };
  }

  if(rail==="right"){
    return {
      x:2*TABLE.right-point.x,
      y:point.y
    };
  }

  if(rail==="top"){
    return {
      x:point.x,
      y:2*TABLE.top-point.y
    };
  }

  return {
    x:point.x,
    y:2*TABLE.bottom-point.y
  };
}

function railIntersection(
  a,
  b,
  rail
){

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  if(
    rail==="left" ||
    rail==="right"
  ){

    if(Math.abs(dx)<0.000001){
      return null;
    }

    const x=
      rail==="left"
        ? TABLE.left
        : TABLE.right;

    const t=
      (x-a.x)/dx;

    if(t<=0 || t>=1){
      return null;
    }

    const y=
      a.y+
      dy*t;

    if(
      y<
        TABLE.top+TABLE.ball*1.2 ||
      y>
        TABLE.bottom-TABLE.ball*1.2
    ){
      return null;
    }

    return {
      x,
      y
    };
  }

  if(Math.abs(dy)<0.000001){
    return null;
  }

  const y=
    rail==="top"
      ? TABLE.top
      : TABLE.bottom;

  const t=
    (y-a.y)/dy;

  if(t<=0 || t>=1){
    return null;
  }

  const x=
    a.x+
    dx*t;

  if(
    x<
      TABLE.left+TABLE.ball*1.2 ||
    x>
      TABLE.right-TABLE.ball*1.2
  ){
    return null;
  }

  return {
    x,
    y
  };
}

function bankShot(
  pocket
){

  const object=state.object;
  const cue=state.cue;

  const rails=[
    "left",
    "right",
    "top",
    "bottom"
  ];

  let best=null;

  for(const rail of rails){

    const target=
      pocketTarget(pocket);

    const reflected=
      reflectedPoint(
        target,
        rail
      );

    const bankPoint=
      railIntersection(
        object,
        reflected,
        rail
      );

    if(!bankPoint){
      continue;
    }

    /*
      Physical object-ball route.
    */
    if(
      pathBlocked(
        object,
        bankPoint,
        ["cue","object"]
      )
    ){
      continue;
    }

    if(
      pathBlocked(
        bankPoint,
        target,
        ["cue","object"]
      )
    ){
      continue;
    }

    /*
      The object ball must approach the rail from
      the correct side and leave it toward the pocket.
    */
    const incoming=
      normalize(
        sub(
          bankPoint,
          object
        )
      );

    const outgoing=
      normalize(
        sub(
          target,
          bankPoint
        )
      );

    /*
      Reject weird paths where the two segments
      don't form a genuine rail rebound.
    */
    if(
      Math.abs(
        dot(
          incoming,
          outgoing
        )
      )>.985
    ){
      continue;
    }

    /*
      The ghost ball is calculated from the direction
      from the object ball toward the bank point.
    */
    const ghost=
      ghostForTarget(
        object,
        bankPoint
      );

    if(
      ghost.x<
        TABLE.left+TABLE.ball ||
      ghost.x>
        TABLE.right-TABLE.ball ||
      ghost.y<
        TABLE.top+TABLE.ball ||
      ghost.y>
        TABLE.bottom-TABLE.ball
    ){
      continue;
    }

    if(
      pathBlocked(
        cue,
        ghost,
        ["cue","object"]
      )
    ){
      continue;
    }

    const cueDistance=
      distance(
        cue,
        ghost
      );

    const objectDistance=
      distance(
        object,
        bankPoint
      )+
      distance(
        bankPoint,
        target
      );

    /*
      Banks are harder than clean direct shots,
      so there is a deliberate complexity penalty.
    */
    const score=
      cueDistance*.72+
      objectDistance*.72+
      130;

    const candidate={
      type:"bank",
      pocket,
      target,
      bankPoint,
      ghost,
      rail,
      cuePath:[cue,ghost],
      objectPath:[
        object,
        bankPoint,
        target
      ],
      score
    };

    if(
      !best ||
      candidate.score<best.score
    ){
      best=candidate;
    }
  }

  return best;
}

/* =========================================================
   ONE RAIL KICK
   ========================================================= */

function kickShot(pocket){

  const cue=state.cue;
  const object=state.object;
  const target=pocketTarget(pocket);

  /*
    Object ball still needs a clear path to the pocket.
  */
  if(
    pathBlocked(
      object,
      target,
      ["cue","object"]
    )
  ){
    return null;
  }

  const rails=[
    "left",
    "right",
    "top",
    "bottom"
  ];

  let best=null;

  for(const rail of rails){

    const reflected=
      reflectedPoint(
        object,
        rail
      );

    const kickPoint=
      railIntersection(
        cue,
        reflected,
        rail
      );

    if(!kickPoint){
      continue;
    }

    if(
      pathBlocked(
        cue,
        kickPoint,
        ["cue","object"]
      )
    ){
      continue;
    }

    if(
      pathBlocked(
        kickPoint,
        object,
        ["cue","object"]
      )
    ){
      continue;
    }

    const total=
      distance(cue,kickPoint)+
      distance(kickPoint,object)+
      distance(object,target)+
      220;

    const candidate={
      type:"kick",
      pocket,
      target,
      kickPoint,
      rail,
      cuePath:[
        cue,
        kickPoint,
        object
      ],
      objectPath:[
        object,
        target
      ],
      score:total
    };

    if(
      !best ||
      candidate.score<best.score
    ){
      best=candidate;
    }
  }

  return best;
}

/* =========================================================
   POCKET VALIDATION
   ========================================================= */

function validateShot(shot){

  if(!shot){
    return false;
  }

  /*
    Every shot MUST have a real pocket.
  */
  if(!shot.pocket){
    return false;
  }

  /*
    Object route must end at that exact pocket.
  */
  const last=
    shot.objectPath[
      shot.objectPath.length-1
    ];

  if(
    distance(
      last,
      shot.target
    )>0.01
  ){
    return false;
  }

  /*
    Bank must physically contain a rail contact.
  */
  if(
    shot.type==="bank" &&
    !shot.bankPoint
  ){
    return false;
  }

  return true;
}

/* =========================================================
   SHOT SELECTION
   ========================================================= */

function analyze(){

  const candidates=[];

  for(const pocket of pockets){

    const direct=
      directShot(pocket);

    if(
      direct &&
      validateShot(direct)
    ){
      candidates.push(direct);
    }

    const bank=
      bankShot(pocket);

    if(
      bank &&
      validateShot(bank)
    ){
      candidates.push(bank);
    }

    const kick=
      kickShot(pocket);

    if(
      kick &&
      validateShot(kick)
    ){
      candidates.push(kick);
    }
  }

  if(!candidates.length){

    state.shot=null;

    updateUI();

    return;
  }

  /*
    Sort by practical score.
  */
  candidates.sort(
    (a,b)=>a.score-b.score
  );

  const best=candidates[0];

  /*
    Beginner-friendly preference:
    if a clean direct shot is reasonably close to
    a bank/kick in score, prefer the direct shot.

    But a clearly superior bank is allowed to win.
  */
  const direct=candidates.find(
    s=>s.type==="cut"
  );

  if(
    direct &&
    best.type!=="cut" &&
    direct.score<=best.score+110
  ){
    state.shot=direct;
  }else{
    state.shot=best;
  }

  updateUI();
}

/* =========================================================
   VISUAL INSTRUCTIONS
   ========================================================= */

function vectorDirectionText(
  from,
  to
){

  const dx=to.x-from.x;
  const dy=to.y-from.y;

  const horizontal=
    Math.abs(dx)<18
      ? ""
      : dx>0
        ? "RIGHT"
        : "LEFT";

  const vertical=
    Math.abs(dy)<18
      ? ""
      : dy>0
        ? "DOWN"
        : "UP";

  if(
    horizontal &&
    vertical
  ){
    return `${vertical} + ${horizontal}`;
  }

  if(horizontal){
    return horizontal;
  }

  if(vertical){
    return vertical;
  }

  return "CENTER";
}

function setAimBall(
  element,
  dot,
  from,
  target
){

  const dx=target.x-from.x;
  const dy=target.y-from.y;

  const angle=
    Math.atan2(dy,dx);

  /*
    For the enlarged visual cue ball we show
    the desired impact direction.
  */
  const normalized=
    normalize({
      x:dx,
      y:dy
    });

  const px=
    50+
    normalized.x*30;

  const py=
    50+
    normalized.y*30;

  dot.style.left=
    `${clamp(px,10,90)}%`;

  dot.style.top=
    `${clamp(py,10,90)}%`;

  const line=
    element.querySelector(".aim-line");

  if(line){
    line.remove();
  }

  const newLine=
    document.createElement("div");

  newLine.className="aim-line";

  newLine.style.width="25px";
  newLine.style.transform=
    `rotate(${angle}rad)`;

  element.appendChild(
    newLine
  );
}

function updateUI(){

  const shot=state.shot;

  if(!shot){

    shotTitle.textContent=
      "No clear shot";

    shotSub.textContent=
      "Try another position.";

    cueTip.textContent=
      "No clean route";

    objectTip.textContent=
      "No clean route";

    why.textContent=
      "The current geometry does not produce a sufficiently clear direct, bank, or kick route to a pocket.";

    return;
  }

  const pocket=
    shot.pocket.label;

  if(shot.type==="cut"){

    shotTitle.textContent=
      `CUT → ${pocket}`;

    shotSub.textContent=
      "Direct shot";

    cueTip.textContent=
      "Aim at the red dot";

    objectTip.textContent=
      "Send it to the red pocket";

    setAimBall(
      document.getElementById("cueAim"),
      cueDot,
      state.cue,
      shot.ghost
    );

    setAimBall(
      document.getElementById("objectAim"),
      objectDot,
      state.object,
      shot.target
    );

    why.textContent=
      `Shot Caller found a direct route to the ${pocket.toLowerCase()} and selected it because it avoids an unnecessary rail and has the simplest available path.`;

  }else if(shot.type==="bank"){

    shotTitle.textContent=
      `BANK → ${pocket}`;

    shotSub.textContent=
      "One rail";

    cueTip.textContent=
      "Aim at the red dot";

    objectTip.textContent=
      "Hit the blue rail mark";

    setAimBall(
      document.getElementById("cueAim"),
      cueDot,
      state.cue,
      shot.ghost
    );

    setAimBall(
      document.getElementById("objectAim"),
      objectDot,
      state.object,
      shot.bankPoint
    );

    why.textContent=
      `The direct routes were not preferred. This one-rail bank is calculated from the object ball to the marked rail contact point and then to the ${pocket.toLowerCase()}.`;

  }else{

    shotTitle.textContent=
      `KICK → ${pocket}`;

    shotSub.textContent=
      "One rail";

    cueTip.textContent=
      "Aim at the red dot";

    objectTip.textContent=
      "Cue ball contacts object";

    setAimBall(
      document.getElementById("cueAim"),
      cueDot,
      state.cue,
      shot.kickPoint
    );

    setAimBall(
      document.getElementById("objectAim"),
      objectDot,
      state.object,
      shot.target
    );

    why.textContent=
      `Shot Caller selected a one-rail kick because the cue ball cannot reach the object ball cleanly by the simpler routes it evaluated.`;
  }
}

/* =========================================================
   DRAWING
   ========================================================= */

function resizeCanvas(){

  const rect=
    canvas.getBoundingClientRect();

  const ratio=
    TABLE.height/TABLE.width;

  const height=
    rect.width*ratio;

  canvas.style.height=
    `${height}px`;

  state.dpr=
    window.devicePixelRatio || 1;

  canvas.width=
    Math.round(
      rect.width*state.dpr
    );

  canvas.height=
    Math.round(
      height*state.dpr
    );

  draw();
}

function scale(){

  const rect=
    canvas.getBoundingClientRect();

  return {
    x:rect.width/TABLE.width,
    y:rect.height/TABLE.height
  };
}

function roundedRect(
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  ctx.closePath();
}

function drawTable(){

  const s=scale();

  ctx.save();

  ctx.setTransform(
    state.dpr*s.x,
    0,
    0,
    state.dpr*s.y,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    TABLE.width,
    TABLE.height
  );

  /*
    Wood/base.
  */
  ctx.fillStyle="#21130b";

  roundedRect(
    0,
    0,
    TABLE.width,
    TABLE.height,
    24
  );

  ctx.fill();

  /*
    Rail.
  */
  ctx.fillStyle="#51321f";

  roundedRect(
    13,
    13,
    TABLE.width-26,
    TABLE.height-26,
    18
  );

  ctx.fill();

  /*
    Felt.
  */
  ctx.fillStyle="#167548";

  roundedRect(
    TABLE.left,
    TABLE.top,
    TABLE.right-TABLE.left,
    TABLE.bottom-TABLE.top,
    8
  );

  ctx.fill();

  /*
    Subtle felt texture.
  */
  ctx.fillStyle="rgba(255,255,255,.018)";

  for(
    let x=TABLE.left;
    x<TABLE.right;
    x+=12
  ){
    ctx.fillRect(
      x,
      TABLE.top,
      1,
      TABLE.bottom-TABLE.top
    );
  }

  /*
    Diamonds.
  */
  drawDiamonds();

  /*
    Pockets.
  */
  pockets.forEach(
    drawPocket
  );

  ctx.restore();
}

function drawDiamonds(){

  const topBottom=[
    .125,
    .25,
    .375,
    .625,
    .75,
    .875
  ];

  topBottom.forEach(f=>{

    const x=
      TABLE.left+
      (TABLE.right-TABLE.left)*f;

    drawDiamond(
      x,
      TABLE.top-16
    );

    drawDiamond(
      x,
      TABLE.bottom+16
    );
  });

  [.25,.5,.75].forEach(f=>{

    const y=
      TABLE.top+
      (TABLE.bottom-TABLE.top)*f;

    drawDiamond(
      TABLE.left-16,
      y
    );

    drawDiamond(
      TABLE.right+16,
      y
    );
  });
}

function drawDiamond(x,y){

  ctx.beginPath();

  ctx.moveTo(x,y-5);
  ctx.lineTo(x+5,y);
  ctx.lineTo(x,y+5);
  ctx.lineTo(x-5,y);
  ctx.closePath();

  ctx.fillStyle="#dfc99a";
  ctx.fill();
}

function drawPocket(pocket){

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocket,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#050807";
  ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.07)";
  ctx.lineWidth=2;
  ctx.stroke();
}

/* =========================================================
   ROUTE DRAWING
   ========================================================= */

function drawRoute(
  points,
  color,
  width,
  dashed=false
){

  if(
    !points ||
    points.length<2
  ){
    return;
  }

  ctx.save();

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(dashed){
    ctx.setLineDash([10,8]);
  }

  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(
    let i=1;
    i<points.length;
    i++
  ){
    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.stroke();

  ctx.restore();
}

function drawArrow(
  from,
  to,
  color
){

  const direction=
    normalize(
      sub(to,from)
    );

  const perpendicular={
    x:-direction.y,
    y:direction.x
  };

  const size=13;

  const tip=to;

  const a=
    add(
      tip,
      add(
        mul(direction,-size),
        mul(perpendicular,size*.55)
      )
    );

  const b=
    add(
      tip,
      add(
        mul(direction,-size),
        mul(perpendicular,-size*.55)
      )
    );

  ctx.save();

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.moveTo(
    tip.x,
    tip.y
  );

  ctx.lineTo(
    a.x,
    a.y
  );

  ctx.lineTo(
    b.x,
    b.y
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

function drawTarget(
  point,
  color,
  radius=8
){

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    point.x,
    point.y,
    radius+7,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    color==="red"
      ? "rgba(255,69,69,.25)"
      : "rgba(88,168,255,.22)";

  ctx.lineWidth=4;
  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    point.x,
    point.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    color==="red"
      ? "#ff4545"
      : "#58a8ff";

  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();
}

function drawPocketTarget(pocket){

  ctx.save();

  /*
    Very obvious red pocket destination.
  */
  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocket+11,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="#ff4545";
  ctx.lineWidth=5;

  ctx.shadowColor="rgba(255,69,69,.75)";
  ctx.shadowBlur=15;

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocket+18,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="rgba(255,69,69,.22)";
  ctx.lineWidth=2;
  ctx.shadowBlur=0;
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   BALL DRAWING
   ========================================================= */

function drawBall(
  ball,
  type,
  selected
){

  const r=TABLE.ball;

  ctx.save();

  if(selected){

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      r+9,
      0,
      Math.PI*2
    );

    ctx.strokeStyle="#35dc7b";
    ctx.lineWidth=3;

    ctx.shadowColor="rgba(53,220,123,.55)";
    ctx.shadowBlur=10;

    ctx.stroke();

    ctx.shadowBlur=0;
  }

  const gradient=
    ctx.createRadialGradient(
      ball.x-r*.4,
      ball.y-r*.4,
      1,
      ball.x,
      ball.y,
      r
    );

  if(type==="cue"){

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .7,
      "#eeeeea"
    );

    gradient.addColorStop(
      1,
      "#b8b8b3"
    );

  }else{

    gradient.addColorStop(
      0,
      "#fff3b0"
    );

    gradient.addColorStop(
      .65,
      "#f3ca55"
    );

    gradient.addColorStop(
      1,
      "#b17d13"
    );
  }

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.strokeStyle="rgba(0,0,0,.5)";
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw(){

  drawTable();

  const shot=state.shot;

  if(shot){

    /*
      Red = actual pocket destination.
    */
    drawPocketTarget(
      shot.pocket
    );

    /*
      Cue-ball path is white.
    */
    drawRoute(
      shot.cuePath,
      "#f5f5f5",
      3,
      true
    );

    /*
      Object-ball path is green.
    */
    drawRoute(
      shot.objectPath,
      "#35dc7b",
      5,
      false
    );

    /*
      Direction arrows.
    */
    if(
      shot.cuePath.length>=2
    ){
      const cueEnd=
        shot.cuePath[
          shot.cuePath.length-1
        ];

      const cueStart=
        shot.cuePath[
          shot.cuePath.length-2
        ];

      drawArrow(
        cueStart,
        cueEnd,
        "#f5f5f5"
      );
    }

    if(
      shot.objectPath.length>=2
    ){

      const start=
        shot.objectPath[
          shot.objectPath.length-2
        ];

      const end=
        shot.objectPath[
          shot.objectPath.length-1
        ];

      drawArrow(
        start,
        end,
        "#35dc7b"
      );
    }

    /*
      Ghost-ball target.
    */
    if(shot.ghost){

      drawTarget(
        shot.ghost,
        "blue",
        6
      );
    }

    /*
      Bank contact point.
    */
    if(shot.bankPoint){

      drawTarget(
        shot.bankPoint,
        "blue",
        8
      );
    }

    /*
      Kick rail contact point.
    */
    if(shot.kickPoint){

      drawTarget(
        shot.kickPoint,
        "blue",
        8
      );
    }
  }

  /*
    Balls always sit above the instructional paths.
  */
  drawBall(
    state.cue,
    "cue",
    state.selected==="cue"
  );

  drawBall(
    state.object,
    "object",
    state.selected==="object"
  );
}

/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);

if(window.ResizeObserver){

  const observer=
    new ResizeObserver(
      resizeCanvas
    );

  observer.observe(
    document.querySelector(".table-wrap")
  );
}

/* =========================================================
   START
   ========================================================= */

selectBall("cue");
analyze();
resizeCanvas();

</script>
