<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#050907">

<title>Shot Caller</title>

<style>
/* =========================================================
   SHOT CALLER — POLISHED UI
   ========================================================= */

:root {
  --bg: #050907;
  --bg-soft: #09100c;

  --panel: #0b130e;
  --panel-2: #101a14;
  --panel-3: #131f17;

  --border: rgba(255,255,255,.075);
  --border-strong: rgba(255,255,255,.12);

  --green: #43e982;
  --green-bright: #5af293;
  --green-dark: #188c4b;

  --red: #ff4545;
  --blue: #62aaff;
  --gold: #e9c34c;

  --text: #f5f7f5;
  --text-soft: #c5cec8;
  --muted: #7f8d84;

  --wood-dark: #1a0f08;
  --wood: #4a2d1b;
  --wood-light: #6b4428;

  --felt: #116d45;
  --felt-dark: #0b5737;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  min-height: 100%;

  background:
    radial-gradient(
      ellipse 100% 70% at 50% -15%,
      #18261c 0%,
      #0a110d 45%,
      #050907 100%
    );

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

body {
  padding-bottom: env(safe-area-inset-bottom);
}

button {
  font: inherit;
}

button,
summary {
  -webkit-user-select: none;
  user-select: none;
}

.app {
  width: 100%;
  max-width: 1220px;

  margin: 0 auto;

  padding:
    10px
    10px
    calc(14px + env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 9px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  position: relative;

  width: 37px;
  height: 37px;

  display: grid;
  place-items: center;

  border-radius: 11px;

  background:
    linear-gradient(
      145deg,
      #62f49a 0%,
      #31d773 48%,
      #1ca85a 100%
    );

  color: #031009;

  font-size: 10px;
  font-weight: 1000;
  letter-spacing: -.06em;

  box-shadow:
    0 7px 22px rgba(67,233,130,.16),
    inset 0 1px 0 rgba(255,255,255,.38);

  overflow: hidden;
}

.logo::after {
  content: "";

  position: absolute;

  width: 22px;
  height: 22px;

  top: -9px;
  right: -8px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.15);
}

.brand-name {
  font-size: 21px;
  line-height: 1;

  font-weight: 950;

  letter-spacing: -.06em;
}

.brand-sub {
  margin-top: 4px;

  color: var(--muted);

  font-size: 9px;
  line-height: 1;

  font-weight: 650;

  letter-spacing: .005em;
}

.live {
  display: flex;
  align-items: center;
  gap: 7px;

  color: #91a096;

  font-size: 7px;
  font-weight: 900;

  letter-spacing: .16em;
}

.live-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 10px rgba(67,233,130,.75);
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.layout {
  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    310px;

  gap: 10px;
}


/* =========================================================
   TABLE CARD
   ========================================================= */

.table-card {
  position: relative;

  padding: 6px;

  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      #0d1710,
      #07100b
    );

  border: 1px solid var(--border);

  box-shadow:
    0 24px 65px rgba(0,0,0,.36),
    inset 0 1px 0 rgba(255,255,255,.035);

  overflow: hidden;
}

.table-card::before {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(255,255,255,.045),
      transparent 48%
    );
}

.table-wrap {
  position: relative;

  width: 100%;

  aspect-ratio: 2 / 1;

  overflow: hidden;

  border-radius: 13px;

  touch-action: none;

  user-select: none;
}

#table {
  display: block;

  width: 100%;
  height: 100%;

  touch-action: none;

  user-select: none;
}


/* =========================================================
   RIGHT SIDE
   ========================================================= */

.controls {
  display: flex;
  flex-direction: column;

  gap: 8px;
}


/* =========================================================
   BALL SELECTOR
   ========================================================= */

.ball-selector {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 5px;

  padding: 5px;

  border-radius: 13px;

  background:
    rgba(11,19,14,.92);

  border: 1px solid var(--border);

  box-shadow:
    0 8px 25px rgba(0,0,0,.13);
}

.ball-button {
  height: 42px;

  border: 1px solid transparent;

  border-radius: 9px;

  background:
    rgba(255,255,255,.025);

  color: #7f8b83;

  font-size: 9px;

  font-weight: 900;

  cursor: pointer;

  transition:
    .18s ease;
}

.ball-button:active {
  transform: scale(.98);
}

.ball-button.selected {
  color: var(--green);

  border-color:
    rgba(67,233,130,.38);

  background:
    linear-gradient(
      145deg,
      rgba(67,233,130,.12),
      rgba(67,233,130,.055)
    );

  box-shadow:
    inset 0 0 0 1px rgba(67,233,130,.035),
    0 4px 14px rgba(0,0,0,.12);
}

.ball-icon {
  display: inline-block;

  width: 11px;
  height: 11px;

  margin-right: 5px;

  vertical-align: -1px;

  border-radius: 50%;

  box-shadow:
    inset -2px -2px 3px rgba(0,0,0,.18),
    0 0 0 1px rgba(0,0,0,.28);
}

.ball-icon.cue {
  background:
    radial-gradient(
      circle at 32% 28%,
      #fff,
      #deded9
    );
}

.ball-icon.object {
  background:
    radial-gradient(
      circle at 32% 28%,
      #fff0a6,
      #d9ad30
    );
}


/* =========================================================
   SHOT CARD
   ========================================================= */

.shot-card {
  padding: 12px;

  border-radius: 15px;

  background:
    linear-gradient(
      150deg,
      rgba(16,27,20,.98),
      rgba(9,17,12,.98)
    );

  border: 1px solid var(--border);

  box-shadow:
    0 12px 32px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.kicker {
  color: var(--green);

  font-size: 7px;

  font-weight: 950;

  letter-spacing: .18em;
}

.shot-title {
  margin-top: 5px;

  font-size: 23px;

  line-height: 1;

  font-weight: 950;

  letter-spacing: -.06em;

  text-shadow:
    0 1px 15px rgba(0,0,0,.35);
}

.shot-sub {
  min-height: 25px;

  margin-top: 6px;

  color: var(--text-soft);

  font-size: 9px;

  line-height: 1.35;

  font-weight: 600;
}


/* =========================================================
   POCKET AREA
   ========================================================= */

.pocket-area {
  margin-top: 9px;
}

.label {
  margin-bottom: 5px;

  color: var(--muted);

  font-size: 7px;

  font-weight: 900;

  letter-spacing: .15em;
}

.pockets {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 5px;
}

.pocket {
  position: relative;

  height: 30px;

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius: 8px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.015)
    );

  color: #7e8981;

  font-size: 6.5px;

  font-weight: 900;

  letter-spacing: .01em;

  cursor: pointer;

  transition:
    border-color .16s ease,
    background .16s ease,
    color .16s ease,
    transform .12s ease;
}

.pocket:active {
  transform: scale(.97);
}

.pocket.selected {
  color: white;

  border-color:
    rgba(255,69,69,.72);

  background:
    linear-gradient(
      145deg,
      rgba(255,69,69,.18),
      rgba(255,69,69,.07)
    );

  box-shadow:
    inset 0 0 0 1px rgba(255,69,69,.06),
    0 0 14px rgba(255,69,69,.07);
}

.pocket.suggested:not(.selected) {
  color: #b8f4cd;

  border-color:
    rgba(67,233,130,.28);

  background:
    rgba(67,233,130,.055);
}

.pocket.suggested:not(.selected)::after {
  content: "BEST";

  position: absolute;

  top: 3px;
  right: 4px;

  color: var(--green);

  font-size: 4.5px;

  letter-spacing: .1em;
}


/* =========================================================
   AIMING CARDS
   ========================================================= */

.aim-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-top: 8px;
}

.aim-card {
  padding: 8px 5px 9px;

  border-radius: 11px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  border:
    1px solid
    rgba(255,255,255,.065);

  text-align: center;
}

.aim-label {
  margin-bottom: 6px;

  color: #8b978f;

  font-size: 6.5px;

  font-weight: 950;

  letter-spacing: .13em;
}

.aim-ball {
  position: relative;

  width: 64px;
  height: 64px;

  margin: 0 auto;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 31% 25%,
      #ffffff 0%,
      #f2f2ef 54%,
      #c5c5c0 83%,
      #a1a19d 100%
    );

  box-shadow:
    inset -7px -8px 13px rgba(0,0,0,.14),
    inset 3px 3px 7px rgba(255,255,255,.65),
    0 5px 12px rgba(0,0,0,.25);
}

.aim-ball.object {
  background:
    radial-gradient(
      circle at 31% 25%,
      #fff5b6 0%,
      #f0cf57 53%,
      #c59724 83%,
      #9c7111 100%
    );
}

.aim-dot {
  position: absolute;

  width: 10px;
  height: 10px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background:
    var(--red);

  border:
    2px solid
    rgba(255,255,255,.92);

  box-shadow:
    0 0 0 3px rgba(255,69,69,.16),
    0 0 12px rgba(255,69,69,.62);
}

.aim-text {
  min-height: 18px;

  margin-top: 6px;

  color: #d0d8d2;

  font-size: 7.5px;

  line-height: 1.15;

  font-weight: 850;
}


/* =========================================================
   RESET
   ========================================================= */

.reset {
  height: 39px;

  border:
    1px solid
    rgba(255,255,255,.075);

  border-radius: 10px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  color: #aab4ad;

  font-size: 8px;

  font-weight: 850;

  cursor: pointer;

  transition:
    .16s ease;
}

.reset:active {
  transform: scale(.985);
}

.reset.active {
  color: var(--green);

  border-color:
    rgba(67,233,130,.38);

  background:
    rgba(67,233,130,.075);
}


/* =========================================================
   DETAILS
   ========================================================= */

.more {
  border-radius: 12px;

  background:
    rgba(11,19,14,.9);

  border:
    1px solid
    rgba(255,255,255,.065);

  overflow: hidden;
}

.more summary {
  padding: 10px 12px;

  cursor: pointer;

  list-style: none;

  color: #b3bdb6;

  font-size: 8px;

  font-weight: 850;
}

.more summary::-webkit-details-marker {
  display: none;
}

.more summary::after {
  content: "+";

  float: right;

  color: #68756c;

  font-size: 12px;

  line-height: 8px;
}

.more[open] summary::after {
  content: "−";
}

.more-content {
  padding:
    0
    12px
    12px;

  color: #78847b;

  font-size: 7.5px;

  line-height: 1.55;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 850px) {

  .layout {
    grid-template-columns: 1fr;
  }

  .controls {
    display: grid;

    grid-template-columns:
      1fr 1fr;

    align-items: start;
  }

  .ball-selector,
  .shot-card,
  .reset,
  .more {
    grid-column: 1 / -1;
  }

}


@media (max-width: 560px) {

  .app {
    padding:
      7px
      7px
      calc(10px + env(safe-area-inset-bottom));
  }

  .header {
    height: 43px;

    margin-bottom: 5px;
  }

  .brand-name {
    font-size: 19px;
  }

  .brand-sub {
    font-size: 8px;
  }

  .live {
    display: none;
  }

  .table-card {
    padding: 4px;

    border-radius: 15px;
  }

  .table-wrap {
    border-radius: 11px;
  }

  .controls {
    display: flex;

    gap: 7px;
  }

  .shot-title {
    font-size: 21px;
  }

  .aim-ball {
    width: 60px;
    height: 60px;
  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {

  .shot-title {
    font-size: 19px;
  }

  .aim-ball {
    width: 56px;
    height: 56px;
  }

  .aim-text {
    font-size: 7px;
  }

}
</style>
</head>


<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        SC
      </div>

      <div>

        <div class="brand-name">
          Shot Caller
        </div>

        <div class="brand-sub">
          I’ll call the shots.
        </div>

      </div>

    </div>

    <div class="live">
      <span class="live-dot"></span>
      AUTO ANALYSIS
    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="layout">


    <!-- ===================================================
         TABLE
    ==================================================== -->

    <section class="table-card">

      <div class="table-wrap">

        <canvas id="table"></canvas>

      </div>

    </section>


    <!-- ===================================================
         CONTROLS
    ==================================================== -->

    <aside class="controls">


      <!-- BALL SELECTOR -->

      <div class="ball-selector">

        <button
          type="button"
          class="ball-button selected"
          id="cueButton"
        >
          <span class="ball-icon cue"></span>
          Cue Ball
        </button>

        <button
          type="button"
          class="ball-button"
          id="objectButton"
        >
          <span class="ball-icon object"></span>
          Object Ball
        </button>

      </div>


      <!-- SHOT CALL -->

      <section class="shot-card">

        <div class="kicker">
          SHOT CALL
        </div>

        <div
          class="shot-title"
          id="shotTitle"
        >
          I’LL CALL THE SHOT
        </div>

        <div
          class="shot-sub"
          id="shotSub"
        >
          Tap or drag the cue ball.
        </div>


        <!-- POCKETS -->

        <div class="pocket-area">

          <div class="label">
            POCKET
          </div>

          <div class="pockets">

            <button
              type="button"
              class="pocket"
              data-pocket="TL"
            >
              TOP LEFT
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="TM"
            >
              TOP
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="TR"
            >
              TOP RIGHT
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="BL"
            >
              BOTTOM LEFT
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="BM"
            >
              BOTTOM
            </button>

            <button
              type="button"
              class="pocket"
              data-pocket="BR"
            >
              BOTTOM RIGHT
            </button>

          </div>

        </div>


        <!-- AIM -->

        <div class="aim-grid">

          <div class="aim-card">

            <div class="aim-label">
              CUE BALL
            </div>

            <div class="aim-ball">

              <div
                class="aim-dot"
                id="cueAimDot"
              ></div>

            </div>

            <div
              class="aim-text"
              id="cueAimText"
            >
              Hit the red dot
            </div>

          </div>


          <div class="aim-card">

            <div class="aim-label">
              OBJECT BALL
            </div>

            <div class="aim-ball object">

              <div
                class="aim-dot"
                id="objectAimDot"
              ></div>

            </div>

            <div
              class="aim-text"
              id="objectAimText"
            >
              Aim at the red dot
            </div>

          </div>

        </div>

      </section>


      <!-- RESET -->

      <button
        type="button"
        class="reset"
        id="resetButton"
      >
        Reset Positions
      </button>


      <!-- WHY -->

      <details class="more">

        <summary>
          Why this shot?
        </summary>

        <div
          class="more-content"
          id="whyText"
        >
          Move the balls around the table and Shot Caller
          will automatically analyze the available routes.
        </div>

      </details>

    </aside>

  </main>

</div>


<script>
"use strict";


/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("table");

const ctx =
  canvas.getContext("2d", {
    alpha: false
  });

const cueButton =
  document.getElementById("cueButton");

const objectButton =
  document.getElementById("objectButton");

const resetButton =
  document.getElementById("resetButton");

const shotTitle =
  document.getElementById("shotTitle");

const shotSub =
  document.getElementById("shotSub");

const whyText =
  document.getElementById("whyText");

const cueAimDot =
  document.getElementById("cueAimDot");

const objectAimDot =
  document.getElementById("objectAimDot");

const cueAimText =
  document.getElementById("cueAimText");

const objectAimText =
  document.getElementById("objectAimText");

const pocketButtons =
  Array.from(
    document.querySelectorAll(".pocket")
  );


/* =========================================================
   WORLD
========================================================= */

const WORLD = {
  width: 1000,
  height: 500
};


/* =========================================================
   TABLE
========================================================= */

const TABLE = {

  left: 56,
  right: 944,

  top: 56,
  bottom: 444,

  ballRadius: 14,

  pocketRadius: 27

};


/* =========================================================
   STATE
========================================================= */

const state = {

  selectedBall: "cue",

  cue: {
    x: 255,
    y: 325
  },

  object: {
    x: 610,
    y: 225
  },

  selectedPocket: null,

  suggestedPocket: null,

  shot: null,

  dragging: null

};


/* =========================================================
   POCKETS
========================================================= */

const pockets = [

  {
    id: "TL",
    name: "TOP LEFT",
    x: TABLE.left,
    y: TABLE.top
  },

  {
    id: "TM",
    name: "TOP",
    x: (TABLE.left + TABLE.right) / 2,
    y: TABLE.top
  },

  {
    id: "TR",
    name: "TOP RIGHT",
    x: TABLE.right,
    y: TABLE.top
  },

  {
    id: "BL",
    name: "BOTTOM LEFT",
    x: TABLE.left,
    y: TABLE.bottom
  },

  {
    id: "BM",
    name: "BOTTOM",
    x: (TABLE.left + TABLE.right) / 2,
    y: TABLE.bottom
  },

  {
    id: "BR",
    name: "BOTTOM RIGHT",
    x: TABLE.right,
    y: TABLE.bottom
  }

];


/* =========================================================
   MATH
========================================================= */

function add(a, b) {

  return {
    x: a.x + b.x,
    y: a.y + b.y
  };

}


function subtract(a, b) {

  return {
    x: a.x - b.x,
    y: a.y - b.y
  };

}


function multiply(a, n) {

  return {
    x: a.x * n,
    y: a.y * n
  };

}


function length(v) {

  return Math.hypot(
    v.x,
    v.y
  );

}


function normalize(v) {

  const l =
    length(v);

  if (
    l < 0.000001
  ) {

    return {
      x: 0,
      y: 0
    };

  }

  return {
    x: v.x / l,
    y: v.y / l
  };

}


function distance(a, b) {

  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );

}


function dot(a, b) {

  return (
    a.x * b.x +
    a.y * b.y
  );

}


function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

  const dpr =
    Math.max(
      1,
      Math.min(
        window.devicePixelRatio || 1,
        3
      )
    );

  canvas.width =
    WORLD.width * dpr;

  canvas.height =
    WORLD.height * dpr;

  canvas.style.width = "100%";
  canvas.style.height = "100%";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  draw();

}


/* =========================================================
   POINTER → WORLD
========================================================= */

function pointerToWorld(event) {

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      WORLD.width /
      rect.width,

    y:
      (
        event.clientY -
        rect.top
      ) *
      WORLD.height /
      rect.height

  };

}


/* =========================================================
   BALL HIT
========================================================= */

function ballAt(point) {

  const objectDistance =
    distance(
      point,
      state.object
    );

  const cueDistance =
    distance(
      point,
      state.cue
    );

  const hitRadius =
    TABLE.ballRadius * 2;

  if (
    cueDistance <= hitRadius &&
    cueDistance <= objectDistance
  ) {

    return "cue";

  }

  if (
    objectDistance <= hitRadius
  ) {

    return "object";

  }

  return null;

}


/* =========================================================
   PLACE BALL
========================================================= */

function placeSelectedBall(point) {

  const selected =
    state.selectedBall;

  const other =
    selected === "cue"
      ? state.object
      : state.cue;

  const ball =
    selected === "cue"
      ? state.cue
      : state.object;


  ball.x =
    clamp(
      point.x,
      TABLE.left + TABLE.ballRadius,
      TABLE.right - TABLE.ballRadius
    );


  ball.y =
    clamp(
      point.y,
      TABLE.top + TABLE.ballRadius,
      TABLE.bottom - TABLE.ballRadius
    );


  /*
    Prevent balls from occupying the same physical space.
  */

  const minimumDistance =
    TABLE.ballRadius * 2.15;

  const separation =
    distance(
      ball,
      other
    );


  if (
    separation < minimumDistance
  ) {

    let direction =
      normalize(
        subtract(
          ball,
          other
        )
      );


    if (
      direction.x === 0 &&
      direction.y === 0
    ) {

      direction = {
        x: 1,
        y: 0
      };

    }


    ball.x =
      other.x +
      direction.x *
      minimumDistance;

    ball.y =
      other.y +
      direction.y *
      minimumDistance;


    ball.x =
      clamp(
        ball.x,
        TABLE.left + TABLE.ballRadius,
        TABLE.right - TABLE.ballRadius
      );

    ball.y =
      clamp(
        ball.y,
        TABLE.top + TABLE.ballRadius,
        TABLE.bottom - TABLE.ballRadius
      );

  }

}


/* =========================================================
   POINTER EVENTS
========================================================= */

canvas.addEventListener(
  "pointerdown",
  function(event) {

    event.preventDefault();

    const point =
      pointerToWorld(event);

    const touched =
      ballAt(point);


    if (touched) {

      state.dragging =
        touched;

      state.selectedBall =
        touched;

      updateBallButtons();

    } else {

      state.dragging =
        state.selectedBall;

      placeSelectedBall(point);

    }


    analyze();
    draw();


    try {

      canvas.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointermove",
  function(event) {

    if (
      !state.dragging
    ) {

      return;

    }

    event.preventDefault();

    const point =
      pointerToWorld(event);

    state.selectedBall =
      state.dragging;

    updateBallButtons();

    placeSelectedBall(point);

    analyze();
    draw();

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointerup",
  function(event) {

    event.preventDefault();

    state.dragging = null;

    try {

      canvas.releasePointerCapture(
        event.pointerId
      );

    } catch (_) {}

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointercancel",
  function() {

    state.dragging = null;

  }
);

/* =========================================================

pocketButtons.forEach(

/* =========================================================
   POCKET LOOKUP
========================================================= */

function pocketById(id) {

  return pockets.find(
    function(pocket) {

      return pocket.id === id;

    }
  ) || null;

}


/* =========================================================
   POINT TO SEGMENT
========================================================= */

function pointToSegmentDistance(
  point,
  start,
  end
) {

  const segment =
    subtract(
      end,
      start
    );

  const segmentLengthSquared =
    dot(
      segment,
      segment
    );


  if (
    segmentLengthSquared <
    0.000001
  ) {

    return distance(
      point,
      start
    );

  }


  const t =
    clamp(
      dot(
        subtract(
          point,
          start
        ),
        segment
      ) /
      segmentLengthSquared,
      0,
      1
    );


  const closest =
    add(
      start,
      multiply(
        segment,
        t
      )
    );


  return distance(
    point,
    closest
  );

}


/* =========================================================
   BLOCKED ROUTE
========================================================= */

function routeBlocked(
  start,
  end,
  ignored
) {

  const ignoredSet =
    new Set(
      ignored || []
    );


  const objects = [

    {
      id: "cue",
      point: state.cue
    },

    {
      id: "object",
      point: state.object
    }

  ];


  const clearance =
    TABLE.ballRadius * 2.05;


  for (
    const item of objects
  ) {

    if (
      ignoredSet.has(item.id)
    ) {

      continue;

    }


    if (
      pointToSegmentDistance(
        item.point,
        start,
        end
      ) < clearance
    ) {

      return true;

    }

  }


  return false;

}


/* =========================================================
   GHOST BALL
========================================================= */

function calculateGhostBall(
  object,
  destination
) {

  const direction =
    normalize(
      subtract(
        destination,
        object
      )
    );


  return add(
    object,
    multiply(
      direction,
      -TABLE.ballRadius * 2
    )
  );

}


/* =========================================================
   DIRECT CUT
========================================================= */

function calculateCut(
  pocket
) {

  const cue =
    state.cue;

  const object =
    state.object;


  const objectDirection =
    normalize(
      subtract(
        pocket,
        object
      )
    );


  if (
    length(objectDirection) <
    0.000001
  ) {

    return null;

  }


  const ghost =
    calculateGhostBall(
      object,
      pocket
    );


  if (
    ghost.x <
      TABLE.left + TABLE.ballRadius ||
    ghost.x >
      TABLE.right - TABLE.ballRadius ||
    ghost.y <
      TABLE.top + TABLE.ballRadius ||
    ghost.y >
      TABLE.bottom - TABLE.ballRadius
  ) {

    return null;

  }


  if (
    routeBlocked(
      object,
      pocket,
      ["object"]
    )
  ) {

    return null;

  }


  if (
    routeBlocked(
      cue,
      ghost,
      ["cue", "object"]
    )
  ) {

    return null;

  }


  const cueDirection =
    normalize(
      subtract(
        ghost,
        cue
      )
    );


  const alignment =
    clamp(
      dot(
        cueDirection,
        objectDirection
      ),
      -1,
      1
    );


  const cutSeverity =
    1 - alignment;


  const cueDistance =
    distance(
      cue,
      ghost
    );


  const objectDistance =
    distance(
      object,
      pocket
    );


  const score =
    cueDistance * .50 +
    objectDistance * .55 +
    cutSeverity * 150;


  return {

    type: "CUT",

    pocket,

    ghost,

    cuePath: [
      cue,
      ghost
    ],

    objectPath: [
      object,
      pocket
    ],

    score

  };

}


/* =========================================================
   REFLECT POINT
========================================================= */

function reflectAcrossRail(
  point,
  rail
) {

  if (
    rail === "left"
  ) {

    return {
      x:
        2 * TABLE.left -
        point.x,

      y:
        point.y
    };

  }


  if (
    rail === "right"
  ) {

    return {
      x:
        2 * TABLE.right -
        point.x,

      y:
        point.y
    };

  }


  if (
    rail === "top"
  ) {

    return {
      x:
        point.x,

      y:
        2 * TABLE.top -
        point.y
    };

  }


  return {

    x:
      point.x,

    y:
      2 * TABLE.bottom -
      point.y

  };

}


/* =========================================================
   LINE → RAIL
========================================================= */

function lineRailIntersection(
  start,
  end,
  rail
) {

  const dx =
    end.x - start.x;

  const dy =
    end.y - start.y;


  if (
    rail === "left" ||
    rail === "right"
  ) {

    if (
      Math.abs(dx) <
      0.000001
    ) {

      return null;

    }


    const x =
      rail === "left"
        ? TABLE.left
        : TABLE.right;


    const t =
      (x - start.x) / dx;


    if (
      t <= 0 ||
      t >= 1
    ) {

      return null;

    }


    const y =
      start.y +
      dy * t;


    if (
      y <
        TABLE.top +
        TABLE.ballRadius * 1.3 ||
      y >
        TABLE.bottom -
        TABLE.ballRadius * 1.3
    ) {

      return null;

    }


    return {
      x,
      y
    };

  }


  if (
    Math.abs(dy) <
    0.000001
  ) {

    return null;

  }


  const y =
    rail === "top"
      ? TABLE.top
      : TABLE.bottom;


  const t =
    (y - start.y) / dy;


  if (
    t <= 0 ||
    t >= 1
  ) {

    return null;

  }


  const x =
    start.x +
    dx * t;


  if (
    x <
      TABLE.left +
      TABLE.ballRadius * 1.3 ||
    x >
      TABLE.right -
      TABLE.ballRadius * 1.3
  ) {

    return null;

  }


  return {
    x,
    y
  };

}


/* =========================================================
   ONE RAIL BANK
========================================================= */

function calculateBank(
  pocket
) {

  const cue =
    state.cue;

  const object =
    state.object;


  const rails = [
    "left",
    "right",
    "top",
    "bottom"
  ];


  let best = null;


  for (
    const rail of rails
  ) {

    /*
      Reflect the ACTUAL pocket.
    */

    const reflectedPocket =
      reflectAcrossRail(
        pocket,
        rail
      );


    /*
      Find the actual rail contact point.
    */

    const bankPoint =
      lineRailIntersection(
        object,
        reflectedPocket,
        rail
      );


    if (!bankPoint) {
      continue;
    }


    if (
      routeBlocked(
        object,
        bankPoint,
        ["object", "cue"]
      )
    ) {

      continue;

    }


    if (
      routeBlocked(
        bankPoint,
        pocket,
        ["object", "cue"]
      )
    ) {

      continue;

    }


    /*
      Ghost-ball position for the object → bankPoint
      portion of the shot.
    */

    const ghost =
      calculateGhostBall(
        object,
        bankPoint
      );


    if (
      ghost.x <
        TABLE.left + TABLE.ballRadius ||
      ghost.x >
        TABLE.right - TABLE.ballRadius ||
      ghost.y <
        TABLE.top + TABLE.ballRadius ||
      ghost.y >
        TABLE.bottom - TABLE.ballRadius
    ) {

      continue;

    }


    if (
      routeBlocked(
        cue,
        ghost,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    const cueDistance =
      distance(
        cue,
        ghost
      );


    const bankDistance =
      distance(
        object,
        bankPoint
      ) +
      distance(
        bankPoint,
        pocket
      );


    const score =
      cueDistance * .45 +
      bankDistance * .48 +
      35;


    const candidate = {

      type: "BANK",

      pocket,

      rail,

      bankPoint,

      ghost,

      cuePath: [
        cue,
        ghost
      ],

      objectPath: [
        object,
        bankPoint,
        pocket
      ],

      score

    };


    if (
      !best ||
      candidate.score <
      best.score
    ) {

      best =
        candidate;

    }

  }


  return best;

}


/* =========================================================
   ONE RAIL KICK
========================================================= */

function calculateKick(
  pocket
) {

  const cue =
    state.cue;

  const object =
    state.object;


  const rails = [
    "left",
    "right",
    "top",
    "bottom"
  ];


  let best = null;


  for (
    const rail of rails
  ) {

    const reflectedObject =
      reflectAcrossRail(
        object,
        rail
      );


    const railPoint =
      lineRailIntersection(
        cue,
        reflectedObject,
        rail
      );


    if (!railPoint) {
      continue;
    }


    if (
      routeBlocked(
        cue,
        railPoint,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    if (
      routeBlocked(
        railPoint,
        object,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    if (
      routeBlocked(
        object,
        pocket,
        ["cue", "object"]
      )
    ) {

      continue;

    }


    const score =
      distance(
        cue,
        railPoint
      ) * .45 +
      distance(
        railPoint,
        object
      ) * .45 +
      distance(
        object,
        pocket
      ) * .40 +
      180;


    const candidate = {

      type: "KICK",

      pocket,

      rail,

      kickPoint: railPoint,

      cuePath: [
        cue,
        railPoint,
        object
      ],

      objectPath: [
        object,
        pocket
      ],

      score

    };


    if (
      !best ||
      candidate.score <
      best.score
    ) {

      best =
        candidate;

    }

  }


  return best;

}


/* =========================================================
   VALIDATE
========================================================= */

function validShot(
  shot
) {

  if (!shot) {
    return false;
  }

  if (!shot.pocket) {
    return false;
  }

  if (
    !shot.objectPath ||
    shot.objectPath.length < 2
  ) {

    return false;

  }


  const finalPoint =
    shot.objectPath[
      shot.objectPath.length - 1
    ];


  /*
    Every calculated shot must end at the actual
    pocket that was selected.
  */

  if (
    distance(
      finalPoint,
      shot.pocket
    ) > .01
  ) {

    return false;

  }


  if (
    shot.type === "BANK"
  ) {

    if (
      shot.objectPath.length !== 3 ||
      !shot.bankPoint
    ) {

      return false;

    }

  }


  return true;

}


/* =========================================================
   SHOTS FOR POCKET
========================================================= */

function shotsForPocket(
  pocket
) {

  const candidates = [];


  const cut =
    calculateCut(
      pocket
    );

  if (
    validShot(cut)
  ) {

    candidates.push(cut);

  }


  const bank =
    calculateBank(
      pocket
    );

  if (
    validShot(bank)
  ) {

    candidates.push(bank);

  }


  const kick =
    calculateKick(
      pocket
    );

  if (
    validShot(kick)
  ) {

    candidates.push(kick);

  }


  return candidates;

}


/* =========================================================
   ANALYZE
========================================================= */

function analyze() {

  let candidates = [];


  if (
    state.selectedPocket
  ) {

    const pocket =
      pocketById(
        state.selectedPocket
      );


    if (pocket) {

      candidates =
        shotsForPocket(
          pocket
        );

    }

  } else {

    for (
      const pocket of pockets
    ) {

      candidates.push(
        ...shotsForPocket(
          pocket
        )
      );

    }

  }


  if (
    candidates.length === 0
  ) {

    state.shot = null;

    state.suggestedPocket = null;

    updatePocketUI();
    updateShotUI();

    return;

  }


  candidates.sort(
    function(a, b) {

      return a.score -
        b.score;

    }
  );


  state.shot =
    candidates[0];

  state.suggestedPocket =
    state.shot.pocket.id;


  updatePocketUI();
  updateShotUI();

}


/* =========================================================
   POCKET UI
========================================================= */

function updatePocketUI() {

  pocketButtons.forEach(
    function(button) {

      const id =
        button.dataset.pocket;


      button.classList.toggle(
        "selected",
        state.selectedPocket === id
      );


      button.classList.toggle(
        "suggested",
        state.selectedPocket === null &&
        state.suggestedPocket === id
      );

    }
  );

}


/* =========================================================
   AIM DOT
========================================================= */

function setAimDot(
  element,
  origin,
  target
) {

  const direction =
    normalize(
      subtract(
        target,
        origin
      )
    );


  const x =
    clamp(
      50 +
      direction.x * 31,
      9,
      91
    );


  const y =
    clamp(
      50 +
      direction.y * 31,
      9,
      91
    );


  element.style.left =
    `${x}%`;

  element.style.top =
    `${y}%`;

}


/* =========================================================
   SHOT UI
========================================================= */

function updateShotUI() {

  const shot =
    state.shot;


  if (!shot) {

    shotTitle.textContent =
      "NO CLEAR SHOT";

    shotSub.textContent =
      "Try moving the balls or choosing another pocket.";

    cueAimText.textContent =
      "No clear route";

    objectAimText.textContent =
      "No clear route";

    whyText.textContent =
      "Shot Caller could not find a sufficiently clear direct, bank, or kick route to the selected pocket.";

    return;

  }


  /* BANK */

  if (
    shot.type === "BANK"
  ) {

    shotTitle.textContent =
      `BANK → ${shot.pocket.name}`;

    shotSub.textContent =
      "One rail. Follow the green path.";

    cueAimText.textContent =
      "Hit the red dot";

    objectAimText.textContent =
      "Send it to the rail";


    setAimDot(
      cueAimDot,
      state.cue,
      shot.ghost
    );


    setAimDot(
      objectAimDot,
      state.object,
      shot.bankPoint
    );


    whyText.textContent =
      `Shot Caller found a one-rail bank using the ${shot.rail} rail. The blue marker shows the calculated rail contact point, and the green path continues from there into the ${shot.pocket.name.toLowerCase()} pocket.`;

    return;

  }


  /* KICK */

  if (
    shot.type === "KICK"
  ) {

    shotTitle.textContent =
      `KICK → ${shot.pocket.name}`;

    shotSub.textContent =
      "One rail to the object ball.";

    cueAimText.textContent =
      "Hit the red dot";

    objectAimText.textContent =
      "Send it to the pocket";


    setAimDot(
      cueAimDot,
      state.cue,
      shot.kickPoint
    );


    setAimDot(
      objectAimDot,
      state.object,
      shot.pocket
    );


    whyText.textContent =
      `Shot Caller selected a one-rail kick using the ${shot.rail} rail. The cue ball reaches the rail first, then the object ball, which is directed toward the ${shot.pocket.name.toLowerCase()} pocket.`;

    return;

  }


  /* CUT */

  shotTitle.textContent =
    `CUT → ${shot.pocket.name}`;

  shotSub.textContent =
    "Direct route.";

  cueAimText.textContent =
    "Hit the red dot";

  objectAimText.textContent =
    "Send it to the pocket";


  setAimDot(
    cueAimDot,
    state.cue,
    shot.ghost
  );


  setAimDot(
    objectAimDot,
    state.object,
    shot.pocket
  );


  whyText.textContent =
    `Shot Caller found a clear direct route to the ${shot.pocket.name.toLowerCase()} pocket, so no rail is required.`;

}


/* =========================================================
   DRAW HELPERS
========================================================= */

function roundedRect(
  x,
  y,
  width,
  height,
  radius
) {

  const r =
    Math.min(
      radius,
      width / 2,
      height / 2
    );


  ctx.beginPath();

  ctx.moveTo(
    x + r,
    y
  );

  ctx.arcTo(
    x + width,
    y,
    x + width,
    y + height,
    r
  );

  ctx.arcTo(
    x + width,
    y + height,
    x,
    y + height,
    r
  );

  ctx.arcTo(
    x,
    y + height,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x + width,
    y,
    r
  );

  ctx.closePath();

}


/* =========================================================
   TABLE
========================================================= */

function drawTable() {

  ctx.clearRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );


  /*
    OUTER WOOD
  */

  const outerGradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      WORLD.height
    );

  outerGradient.addColorStop(
    0,
    "#5b3921"
  );

  outerGradient.addColorStop(
    .45,
    "#3f2617"
  );

  outerGradient.addColorStop(
    1,
    "#26140b"
  );


  ctx.fillStyle =
    outerGradient;


  roundedRect(
    0,
    0,
    WORLD.width,
    WORLD.height,
    25
  );

  ctx.fill();


  /*
    WOOD HIGHLIGHT
  */

  ctx.strokeStyle =
    "rgba(255,255,255,.07)";

  ctx.lineWidth = 2;

  roundedRect(
    7,
    7,
    WORLD.width - 14,
    WORLD.height - 14,
    22
  );

  ctx.stroke();


  /*
    INNER RAIL
  */

  ctx.fillStyle =
    "#4a2d1b";


  roundedRect(
    18,
    18,
    WORLD.width - 36,
    WORLD.height - 36,
    17
  );

  ctx.fill();


  /*
    FELT
  */

  const feltGradient =
    ctx.createLinearGradient(
      TABLE.left,
      TABLE.top,
      TABLE.right,
      TABLE.bottom
    );


  feltGradient.addColorStop(
    0,
    "#16794d"
  );

  feltGradient.addColorStop(
    .48,
    "#126d45"
  );

  feltGradient.addColorStop(
    1,
    "#0c5b3a"
  );


  ctx.fillStyle =
    feltGradient;


  roundedRect(
    TABLE.left,
    TABLE.top,
    TABLE.right - TABLE.left,
    TABLE.bottom - TABLE.top,
    8
  );

  ctx.fill();


  /*
    FELT LIGHT
  */

  const feltLight =
    ctx.createRadialGradient(
      470,
      150,
      20,
      500,
      250,
      570
    );


  feltLight.addColorStop(
    0,
    "rgba(255,255,255,.045)"
  );

  feltLight.addColorStop(
    .55,
    "rgba(255,255,255,.008)"
  );

  feltLight.addColorStop(
    1,
    "rgba(0,0,0,.13)"
  );


  ctx.fillStyle =
    feltLight;


  roundedRect(
    TABLE.left,
    TABLE.top,
    TABLE.right - TABLE.left,
    TABLE.bottom - TABLE.top,
    8
  );

  ctx.fill();


  drawDiamonds();


  pockets.forEach(
    drawPocket
  );

}


/* =========================================================
   DIAMONDS
========================================================= */

function drawDiamond(
  x,
  y
) {

  ctx.beginPath();

  ctx.moveTo(
    x,
    y - 5
  );

  ctx.lineTo(
    x + 5,
    y
  );

  ctx.lineTo(
    x,
    y + 5
  );

  ctx.lineTo(
    x - 5,
    y
  );

  ctx.closePath();


  ctx.fillStyle =
    "#dfc48b";

  ctx.shadowColor =
    "rgba(0,0,0,.35)";

  ctx.shadowBlur = 2;

  ctx.fill();

  ctx.shadowBlur = 0;

}


function drawDiamonds() {

  const horizontal = [
    .125,
    .25,
    .375,
    .625,
    .75,
    .875
  ];


  horizontal.forEach(
    function(ratio) {

      const x =
        TABLE.left +
        (
          TABLE.right -
          TABLE.left
        ) *
        ratio;


      drawDiamond(
        x,
        TABLE.top - 17
      );


      drawDiamond(
        x,
        TABLE.bottom + 17
      );

    }
  );


  [.25,.5,.75].forEach(
    function(ratio) {

      const y =
        TABLE.top +
        (
          TABLE.bottom -
          TABLE.top
        ) *
        ratio;


      drawDiamond(
        TABLE.left - 17,
        y
      );


      drawDiamond(
        TABLE.right + 17,
        y
      );

    }
  );

}


/* =========================================================
   POCKET
========================================================= */

function drawPocket(
  pocket
) {

  /*
    Pocket center and calculation center are EXACTLY
    identical.
  */

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocketRadius,
    0,
    Math.PI * 2
  );


  const gradient =
    ctx.createRadialGradient(
      pocket.x - 5,
      pocket.y - 5,
      1,
      pocket.x,
      pocket.y,
      TABLE.pocketRadius
    );


  gradient.addColorStop(
    0,
    "#000000"
  );

  gradient.addColorStop(
    1,
    "#020302"
  );


  ctx.fillStyle =
    gradient;

  ctx.fill();


  ctx.strokeStyle =
    "rgba(255,255,255,.055)";

  ctx.lineWidth = 2;

  ctx.stroke();

}


/* =========================================================
   POCKET TARGET
========================================================= */

function drawPocketTarget(
  pocket
) {

  ctx.save();


  /*
    Soft glow.
  */

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocketRadius + 15,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "rgba(255,69,69,.20)";

  ctx.lineWidth = 7;

  ctx.shadowColor =
    "rgba(255,69,69,.7)";

  ctx.shadowBlur = 18;

  ctx.stroke();


  /*
    Precision ring.
  */

  ctx.shadowBlur = 0;

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocketRadius + 8,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "#ff4545";

  ctx.lineWidth = 3;

  ctx.stroke();


  /*
    Center dot.
  */

  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    4,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ff4545";

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   ROUTE
========================================================= */

function drawRoute(
  points,
  color,
  width,
  dashed
) {

  if (
    !points ||
    points.length < 2
  ) {

    return;

  }


  ctx.save();

  ctx.strokeStyle =
    color;

  ctx.lineWidth =
    width;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  if (dashed) {

    ctx.setLineDash([
      9,
      9
    ]);

  } else {

    ctx.setLineDash([]);

  }


  /*
    Soft glow underneath route.
  */

  ctx.shadowColor =
    color;

  ctx.shadowBlur =
    dashed
      ? 5
      : 8;


  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );


  for (
    let i = 1;
    i < points.length;
    i++
  ) {

    ctx.lineTo(
      points[i].x,
      points[i].y
    );

  }


  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   ARROW
========================================================= */

function drawArrow(
  from,
  to,
  color
) {

  const direction =
    normalize(
      subtract(
        to,
        from
      )
    );


  if (
    length(direction) <
    .001
  ) {

    return;

  }


  const perpendicular = {
    x: -direction.y,
    y: direction.x
  };


  const size = 13;


  const left =
    add(
      to,
      add(
        multiply(
          direction,
          -size
        ),
        multiply(
          perpendicular,
          size * .55
        )
      )
    );


  const right =
    add(
      to,
      add(
        multiply(
          direction,
          -size
        ),
        multiply(
          perpendicular,
          -size * .55
        )
      )
    );


  ctx.save();

  ctx.fillStyle =
    color;

  ctx.shadowColor =
    color;

  ctx.shadowBlur = 6;


  ctx.beginPath();

  ctx.moveTo(
    to.x,
    to.y
  );

  ctx.lineTo(
    left.x,
    left.y
  );

  ctx.lineTo(
    right.x,
    right.y
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}


/* =========================================================
   TARGET
========================================================= */

function drawTarget(
  point,
  type
) {

  const color =
    type === "red"
      ? "#ff4545"
      : "#62aaff";


  ctx.save();


  ctx.beginPath();

  ctx.arc(
    point.x,
    point.y,
    14,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    type === "red"
      ? "rgba(255,69,69,.24)"
      : "rgba(98,170,255,.28)";

  ctx.lineWidth = 4;

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    point.x,
    point.y,
    7,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    color;

  ctx.fill();


  ctx.strokeStyle =
    "rgba(255,255,255,.95)";

  ctx.lineWidth = 2;

  ctx.stroke();


  ctx.restore();

}


/* =========================================================
   BALL
========================================================= */

function drawBall(
  ball,
  type,
  selected
) {

  const r =
    TABLE.ballRadius;


  /*
    Selected ball ring.
  */

  if (selected) {

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      r + 9,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "#43e982";

    ctx.lineWidth = 3;

    ctx.shadowColor =
      "rgba(67,233,130,.75)";

    ctx.shadowBlur = 13;

    ctx.stroke();

    ctx.restore();

  }


  /*
    Ball gradient.
  */

  const gradient =
    ctx.createRadialGradient(
      ball.x - r * .38,
      ball.y - r * .42,
      1,
      ball.x,
      ball.y,
      r
    );


  if (
    type === "cue"
  ) {

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .60,
      "#eeeeeb"
    );

    gradient.addColorStop(
      1,
      "#aaa9a5"
    );

  } else {

    gradient.addColorStop(
      0,
      "#fff5b8"
    );

    gradient.addColorStop(
      .60,
      "#eac34b"
    );

    gradient.addColorStop(
      1,
      "#a9750e"
    );

  }


  ctx.save();

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    r,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    gradient;

  ctx.shadowColor =
    "rgba(0,0,0,.38)";

  ctx.shadowBlur = 5;

  ctx.shadowOffsetY = 2;

  ctx.fill();


  ctx.shadowBlur = 0;

  ctx.shadowOffsetY = 0;

  ctx.strokeStyle =
    "rgba(0,0,0,.52)";

  ctx.lineWidth = 1.4;

  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

  const dpr =
    canvas.width /
    WORLD.width;


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  drawTable();


  const shot =
    state.shot;


  if (shot) {

    /*
      Pocket target.
    */

    drawPocketTarget(
      shot.pocket
    );


    /*
      Cue-ball route.
    */

    drawRoute(
      shot.cuePath,
      "#f7f8f5",
      3,
      true
    );


    /*
      Object-ball route.
    */

    drawRoute(
      shot.objectPath,
      "#43e982",
      5,
      false
    );


    /*
      Cue arrow.
    */

    if (
      shot.cuePath.length >= 2
    ) {

      const from =
        shot.cuePath[
          shot.cuePath.length - 2
        ];

      const to =
        shot.cuePath[
          shot.cuePath.length - 1
        ];


      drawArrow(
        from,
        to,
        "#f7f8f5"
      );

    }


    /*
      Final object-ball arrow.
    */

    if (
      shot.objectPath.length >= 2
    ) {

      const from =
        shot.objectPath[
          shot.objectPath.length - 2
        ];

      const to =
        shot.objectPath[
          shot.objectPath.length - 1
        ];


      drawArrow(
        from,
        to,
        "#43e982"
      );

    }


    /*
      Ghost ball.
    */

    if (
      shot.ghost
    ) {

      drawTarget(
        shot.ghost,
        "blue"
      );

    }


    /*
      Bank contact.
    */

    if (
      shot.bankPoint
    ) {

      drawTarget(
        shot.bankPoint,
        "blue"
      );

    }


    /*
      Kick contact.
    */

    if (
      shot.kickPoint
    ) {

      drawTarget(
        shot.kickPoint,
        "blue"
      );

    }

  }


  /*
    Balls are drawn last so they always sit above
    the route graphics.
  */

  drawBall(
    state.cue,
    "cue",
    state.selectedBall === "cue"
  );


  drawBall(
    state.object,
    "object",
    state.selectedBall === "object"
  );

}


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
  "click",
  function() {

    state.cue = {
      x: 255,
      y: 325
    };


    state.object = {
      x: 610,
      y: 225
    };


    state.selectedBall =
      "cue";


    state.selectedPocket =
      null;


    state.suggestedPocket =
      null;


    state.dragging =
      null;


    updateBallButtons();


    resetButton.classList.add(
      "active"
    );


    setTimeout(
      function() {

        resetButton.classList.remove(
          "active"
        );

      },
      300
    );


    analyze();
    draw();

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   INITIALIZE
========================================================= */

updateBallButtons();

analyze();

resizeCanvas();

</script>
