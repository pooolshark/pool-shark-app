<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>
<meta name="theme-color" content="#06100a">
<title>Shot Caller</title>

<style>
:root{
  --bg:#060c08;
  --panel:#0c1510;
  --panel-2:#101c14;
  --border:#243329;

  --felt:#146f46;
  --felt-dark:#0e5837;
  --rail:#4c2f1d;
  --rail-light:#68432a;

  --white:#f7f8f5;
  --muted:#8d9a91;

  --green:#37e27d;
  --green-soft:rgba(55,226,125,.13);

  --red:#ff4141;
  --red-soft:rgba(255,65,65,.18);

  --blue:#5ca9ff;
  --gold:#f3c94e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% -10%,
      #14251a 0%,
      var(--bg) 45%
    );
  color:var(--white);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:1180px;
  margin:auto;
  padding:12px;
}

/* =========================
   HEADER
   ========================= */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 3px 11px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;

  background:
    linear-gradient(
      145deg,
      #45ec89,
      #24bd63
    );

  color:#041009;
  font-weight:1000;
  font-size:11px;
  letter-spacing:-.04em;

  box-shadow:
    0 5px 18px rgba(55,226,125,.18);
}

.brand-name{
  font-size:21px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.055em;
}

.brand-tagline{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
}

.auto-status{
  display:flex;
  align-items:center;
  gap:6px;

  color:var(--green);
  font-size:9px;
  font-weight:900;
  letter-spacing:.13em;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

/* =========================
   MAIN LAYOUT
   ========================= */

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 290px;
  gap:11px;
}

/* =========================
   TABLE
   ========================= */

.table-card{
  background:
    linear-gradient(
      145deg,
      #0c1710,
      #09120d
    );

  border:1px solid var(--border);
  border-radius:17px;
  padding:7px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.22);
}

.table-wrap{
  width:100%;
  position:relative;
  overflow:hidden;
  border-radius:12px;

  touch-action:none;
  user-select:none;
}

canvas{
  display:block;
  width:100%;
  height:auto;

  touch-action:none;
}

/* =========================
   SIDE PANEL
   ========================= */

.controls{
  display:flex;
  flex-direction:column;
  gap:9px;
}

/* =========================
   BALL PLACEMENT
   ========================= */

.ball-selector{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;

  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:7px;
}

.ball-button{
  min-height:48px;

  border:1px solid var(--border);
  border-radius:10px;

  background:var(--panel-2);
  color:var(--white);

  font-size:11px;
  font-weight:850;

  transition:
    background .12s ease,
    border-color .12s ease,
    transform .08s ease;
}

.ball-button:active{
  transform:scale(.98);
}

.ball-button.selected{
  border-color:var(--green);
  color:var(--green);
  background:var(--green-soft);

  box-shadow:
    inset 0 0 0 1px rgba(55,226,125,.07);
}

.ball-icon{
  display:inline-block;

  width:11px;
  height:11px;

  margin-right:5px;
  vertical-align:-1px;

  border-radius:50%;
}

.ball-icon.cue{
  background:#fff;
  box-shadow:
    0 0 0 1px #777;
}

.ball-icon.object{
  background:var(--gold);
}

/* =========================
   SHOT CALL
   ========================= */

.recommendation{
  background:
    linear-gradient(
      150deg,
      #0d1811,
      #0b140e
    );

  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;

  overflow:hidden;
}

.rec-kicker{
  color:var(--green);
  font-size:8px;
  font-weight:950;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.rec-title{
  margin-top:5px;

  font-size:25px;
  line-height:1;

  font-weight:950;
  letter-spacing:-.055em;
}

.rec-sub{
  margin-top:6px;

  color:#b5c0b8;

  font-size:10px;
  line-height:1.35;
  font-weight:600;
}

/* =========================
   POCKET PICKER
   ========================= */

.pocket-section{
  margin-top:11px;
}

.section-label{
  margin-bottom:6px;

  color:var(--muted);
  font-size:8px;
  font-weight:900;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.pocket-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.pocket-button{
  min-height:31px;

  border:1px solid var(--border);
  border-radius:8px;

  background:#101b14;
  color:#9ca9a1;

  font-size:8px;
  font-weight:900;

  transition:.12s ease;
}

.pocket-button.selected{
  color:#fff;

  border-color:var(--red);

  background:
    linear-gradient(
      145deg,
      rgba(255,65,65,.19),
      rgba(255,65,65,.07)
    );

  box-shadow:
    0 0 0 1px rgba(255,65,65,.08) inset;
}

.pocket-button.suggested{
  position:relative;
}

.pocket-button.suggested::after{
  content:"BEST";

  position:absolute;
  top:3px;
  right:4px;

  font-size:5px;
  letter-spacing:.08em;

  color:var(--red);
}

/* =========================
   ENLARGED BALL GUIDES
   ========================= */

.visual-aim{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;

  margin-top:10px;
}

.aim-card{
  padding:8px 6px;

  border:1px solid var(--border);
  border-radius:10px;

  background:#101b14;

  text-align:center;
}

.aim-label{
  margin-bottom:6px;

  color:var(--muted);

  font-size:7px;
  font-weight:950;
  letter-spacing:.12em;
}

.aim-ball{
  position:relative;

  width:68px;
  height:68px;

  margin:auto;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 34% 29%,
      #fff 0%,
      #f4f4f0 58%,
      #b8b8b2 100%
    );

  box-shadow:
    inset -7px -8px 12px rgba(0,0,0,.13),
    0 3px 9px rgba(0,0,0,.28);
}

.aim-ball.object{
  background:
    radial-gradient(
      circle at 34% 29%,
      #fff0a9 0%,
      #f3ca50 58%,
      #ad7a12 100%
    );
}

/*
  IMPORTANT:
  Only the dot is shown.
  No line.
*/
.aim-dot{
  position:absolute;

  width:12px;
  height:12px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:var(--red);

  border:2px solid #fff;

  box-shadow:
    0 0 0 4px rgba(255,65,65,.20),
    0 0 13px rgba(255,65,65,.65);
}

.aim-tip{
  margin-top:7px;

  color:#d5ddd7;

  font-size:9px;
  line-height:1.2;
  font-weight:850;
}

/* =========================
   RESET
   ========================= */

.reset{
  min-height:42px;

  border:1px solid var(--border);
  border-radius:11px;

  background:var(--panel-2);
  color:var(--white);

  font-size:10px;
  font-weight:850;
}

.reset:active{
  transform:scale(.99);
}

.reset.flash{
  border-color:var(--green);
  color:var(--green);
}

/* =========================
   WHY
   ========================= */

.more{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.more summary{
  cursor:pointer;
  list-style:none;

  padding:11px 13px;

  font-size:10px;
  font-weight:850;
}

.more summary::-webkit-details-marker{
  display:none;
}

.more-content{
  padding:
    0
    13px
    13px;

  color:var(--muted);

  font-size:9px;
  line-height:1.5;
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:820px){

  .main{
    grid-template-columns:1fr;
  }

  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .ball-selector,
  .recommendation,
  .more,
  .reset{
    grid-column:1 / -1;
  }
}

@media(max-width:560px){

  .app{
    padding:7px;
  }

  header{
    padding-bottom:7px;
  }

  .brand-name{
    font-size:19px;
  }

  .auto-status{
    display:none;
  }

  .table-card{
    padding:4px;
    border-radius:14px;
  }

  .main{
    gap:7px;
  }

  .controls{
    display:flex;
    gap:7px;
  }

  .ball-selector{
    padding:6px;
  }

  .recommendation{
    padding:11px;
  }

  .rec-title{
    font-size:23px;
  }

  .aim-ball{
    width:62px;
    height:62px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">

    <div class="brand-mark">
      SC
    </div>

    <div>

      <div class="brand-name">
        Shot Caller
      </div>

      <div class="brand-tagline">
        I’ll call the shot.
      </div>

    </div>

  </div>

  <div class="auto-status">
    <span class="status-dot"></span>
    AUTO ANALYSIS
  </div>

</header>


<div class="main">

<!-- =====================================================
     TABLE
===================================================== -->

<section class="table-card">

  <div class="table-wrap">

    <canvas id="table"></canvas>

  </div>

</section>


<!-- =====================================================
     CONTROLS
===================================================== -->

<aside class="controls">


  <!-- BALL SELECTION -->

  <div class="ball-selector">

    <button
      class="ball-button selected"
      id="cueSelect"
    >
      <span class="ball-icon cue"></span>
      Cue Ball
    </button>

    <button
      class="ball-button"
      id="objectSelect"
    >
      <span class="ball-icon object"></span>
      Object Ball
    </button>

  </div>


  <!-- SHOT RECOMMENDATION -->

  <section class="recommendation">

    <div class="rec-kicker">
      SHOT CALL
    </div>

    <div
      class="rec-title"
      id="shotTitle"
    >
      I’ll call the shot
    </div>

    <div
      class="rec-sub"
      id="shotSub"
    >
      Choose a ball, then tap where it sits on the table.
    </div>


    <!-- POCKET PICKER -->

    <div class="pocket-section">

      <div class="section-label">
        Pocket
      </div>

      <div class="pocket-grid">

        <button
          class="pocket-button"
          data-pocket="TL"
        >
          TOP LEFT
        </button>

        <button
          class="pocket-button"
          data-pocket="TM"
        >
          TOP
        </button>

        <button
          class="pocket-button"
          data-pocket="TR"
        >
          TOP RIGHT
        </button>

        <button
          class="pocket-button"
          data-pocket="BL"
        >
          BOTTOM LEFT
        </button>

        <button
          class="pocket-button"
          data-pocket="BM"
        >
          BOTTOM
        </button>

        <button
          class="pocket-button"
          data-pocket="BR"
        >
          BOTTOM RIGHT
        </button>

      </div>

    </div>


    <!-- ENLARGED AIMING GUIDES -->

    <div class="visual-aim">

      <div class="aim-card">

        <div class="aim-label">
          CUE BALL
        </div>

        <div
          class="aim-ball"
          id="cueAim"
        >

          <div
            class="aim-dot"
            id="cueDot"
          ></div>

        </div>

        <div
          class="aim-tip"
          id="cueTip"
        >
          Aim here
        </div>

      </div>


      <div class="aim-card">

        <div class="aim-label">
          OBJECT BALL
        </div>

        <div
          class="aim-ball object"
          id="objectAim"
        >

          <div
            class="aim-dot"
            id="objectDot"
          ></div>

        </div>

        <div
          class="aim-tip"
          id="objectTip"
        >
          Aim here
        </div>

      </div>

    </div>

  </section>


  <!-- RESET -->

  <button
    class="reset"
    id="reset"
  >
    Reset Positions
  </button>


  <!-- EXPLANATION -->

  <details class="more">

    <summary>
      Why this shot?
    </summary>

    <div
      class="more-content"
      id="why"
    >
      Shot analysis will appear here.
    </div>

  </details>

</aside>

</div>

</div>


<script>

/* =========================================================
   SHOT CALLER
   =========================================================

   CORE PRINCIPLE:

   User provides:
     1. Cue-ball position
     2. Object-ball position
     3. Optional pocket preference

   Shot Caller determines:
     - direct cut
     - one-rail bank
     - one-rail kick

   The displayed route MUST end at the selected pocket.

========================================================= */


/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("table");

const ctx =
  canvas.getContext("2d");


/* =========================================================
   UI
========================================================= */

const cueSelect =
  document.getElementById("cueSelect");

const objectSelect =
  document.getElementById("objectSelect");

const resetButton =
  document.getElementById("reset");

const shotTitle =
  document.getElementById("shotTitle");

const shotSub =
  document.getElementById("shotSub");

const cueTip =
  document.getElementById("cueTip");

const objectTip =
  document.getElementById("objectTip");

const why =
  document.getElementById("why");

const cueDot =
  document.getElementById("cueDot");

const objectDot =
  document.getElementById("objectDot");

const pocketButtons =
  [...document.querySelectorAll(".pocket-button")];


/* =========================================================
   TABLE GEOMETRY
========================================================= */

const TABLE = {

  width:1000,

  height:500,

  left:56,

  right:944,

  top:56,

  bottom:444,

  ball:14,

  pocket:28
};


/* =========================================================
   POCKETS
========================================================= */

const pockets = [

  {
    id:"TL",
    x:TABLE.left,
    y:TABLE.top,
    label:"TOP LEFT"
  },

  {
    id:"TM",
    x:(TABLE.left+TABLE.right)/2,
    y:TABLE.top,
    label:"TOP MIDDLE"
  },

  {
    id:"TR",
    x:TABLE.right,
    y:TABLE.top,
    label:"TOP RIGHT"
  },

  {
    id:"BL",
    x:TABLE.left,
    y:TABLE.bottom,
    label:"BOTTOM LEFT"
  },

  {
    id:"BM",
    x:(TABLE.left+TABLE.right)/2,
    y:TABLE.bottom,
    label:"BOTTOM MIDDLE"
  },

  {
    id:"BR",
    x:TABLE.right,
    y:TABLE.bottom,
    label:"BOTTOM RIGHT"
  }

];


/* =========================================================
   STATE
========================================================= */

const state = {

  cue:{
    x:250,
    y:325
  },

  object:{
    x:600,
    y:230
  },

  selectedBall:"cue",

  /*
    null = Shot Caller chooses.

    Otherwise user has explicitly chosen
    a pocket and the app must respect it.
  */
  selectedPocket:null,

  suggestedPocket:null,

  shot:null,

  dpr:window.devicePixelRatio || 1

};


/* =========================================================
   MATH
========================================================= */

function add(a,b){
  return {
    x:a.x+b.x,
    y:a.y+b.y
  };
}

function sub(a,b){
  return {
    x:a.x-b.x,
    y:a.y-b.y
  };
}

function mul(a,n){
  return {
    x:a.x*n,
    y:a.y*n
  };
}

function dot(a,b){
  return a.x*b.x+a.y*b.y;
}

function len(a){
  return Math.hypot(a.x,a.y);
}

function normalize(a){

  const l=len(a);

  if(!l){
    return {x:0,y:0};
  }

  return {
    x:a.x/l,
    y:a.y/l
  };

}

function distance(a,b){
  return len(sub(a,b));
}

function clamp(v,min,max){
  return Math.max(
    min,
    Math.min(max,v)
  );
}


/* =========================================================
   BALL SELECTION
========================================================= */

function selectBall(which){

  state.selectedBall=which;

  cueSelect.classList.toggle(
    "selected",
    which==="cue"
  );

  objectSelect.classList.toggle(
    "selected",
    which==="object"
  );

  if(which==="cue"){

    shotSub.textContent =
      "Tap the table to place your cue ball.";

  }else{

    shotSub.textContent =
      "Tap the table to place your object ball.";

  }

  draw();

}


cueSelect.addEventListener(
  "click",
  ()=>{
    selectBall("cue");
  }
);


objectSelect.addEventListener(
  "click",
  ()=>{
    selectBall("object");
  }
);


/* =========================================================
   POCKET SELECTION
========================================================= */

pocketButtons.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      const id =
        button.dataset.pocket;

      /*
        Tapping the selected pocket again returns
        control to automatic pocket selection.
      */

      if(
        state.selectedPocket===id
      ){

        state.selectedPocket=null;

      }else{

        state.selectedPocket=id;

      }

      analyze();
      draw();

    }
  );

});


function getPocketById(id){

  return pockets.find(
    p=>p.id===id
  );

}


/* =========================================================
   TABLE TAP PLACEMENT
========================================================= */

function canvasPoint(e){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      (e.clientX-rect.left) *
      TABLE.width /
      rect.width,

    y:
      (e.clientY-rect.top) *
      TABLE.height /
      rect.height

  };

}


function placeBall(point){

  const ball =
    state.selectedBall==="cue"
      ? state.cue
      : state.object;

  const other =
    state.selectedBall==="cue"
      ? state.object
      : state.cue;

  ball.x =
    clamp(
      point.x,
      TABLE.left+TABLE.ball,
      TABLE.right-TABLE.ball
    );

  ball.y =
    clamp(
      point.y,
      TABLE.top+TABLE.ball,
      TABLE.bottom-TABLE.ball
    );


  /*
    Don't allow balls to overlap.
  */

  const minimum =
    TABLE.ball*2.15;

  if(
    distance(ball,other)<minimum
  ){

    let direction =
      normalize(
        sub(ball,other)
      );

    /*
      If the two balls were exactly on top
      of one another, give us a useful default.
    */

    if(
      !direction.x &&
      !direction.y
    ){

      direction={
        x:1,
        y:0
      };

    }

    ball.x =
      other.x+
      direction.x*minimum;

    ball.y =
      other.y+
      direction.y*minimum;

  }

}


canvas.addEventListener(
  "pointerup",
  event=>{

    event.preventDefault();

    placeBall(
      canvasPoint(event)
    );

    analyze();
    draw();

  },
  {
    passive:false
  }
);


/* =========================================================
   SEGMENT COLLISION
========================================================= */

function pointSegmentDistance(
  p,
  a,
  b
){

  const ab =
    sub(b,a);

  const denom =
    dot(ab,ab);

  if(!denom){
    return distance(p,a);
  }

  const t =
    clamp(
      dot(
        sub(p,a),
        ab
      )/denom,
      0,
      1
    );

  const nearest =
    add(
      a,
      mul(ab,t)
    );

  return distance(
    p,
    nearest
  );

}


function blocked(
  a,
  b,
  ignored=[]
){

  const balls = [

    {
      id:"cue",
      point:state.cue
    },

    {
      id:"object",
      point:state.object
    }

  ];

  for(
    const ball of balls
  ){

    if(
      ignored.includes(ball.id)
    ){
      continue;
    }

    /*
      Object/cue ball clearance.

      This is deliberately conservative so Shot Caller
      doesn't tell a beginner that two balls magically
      pass through each other.
    */

    const clearance =
      TABLE.ball*2.05;

    if(
      pointSegmentDistance(
        ball.point,
        a,
        b
      ) < clearance
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   GHOST BALL
========================================================= */

function ghostBall(
  object,
  directionPoint
){

  const direction =
    normalize(
      sub(
        directionPoint,
        object
      )
    );

  return add(
    object,
    mul(
      direction,
      -TABLE.ball*2
    )
  );

}


/* =========================================================
   DIRECT CUT
========================================================= */

function calculateDirect(
  pocket
){

  const cue =
    state.cue;

  const object =
    state.object;

  const target =
    pocket;

  const objectDirection =
    normalize(
      sub(
        target,
        object
      )
    );

  /*
    Ghost ball is behind the object ball relative
    to the pocket.

    This is the actual collision geometry.
  */

  const ghost =
    add(
      object,
      mul(
        objectDirection,
        -TABLE.ball*2
      )
    );


  /*
    Ghost ball must be on the playable table.
  */

  if(
    ghost.x <
      TABLE.left+TABLE.ball ||
    ghost.x >
      TABLE.right-TABLE.ball ||
    ghost.y <
      TABLE.top+TABLE.ball ||
    ghost.y >
      TABLE.bottom-TABLE.ball
  ){

    return null;

  }


  /*
    Object -> pocket must be unobstructed.
  */

  if(
    blocked(
      object,
      target,
      ["object"]
    )
  ){

    return null;

  }


  /*
    Cue -> ghost must be unobstructed.
  */

  if(
    blocked(
      cue,
      ghost,
      ["cue","object"]
    )
  ){

    return null;

  }


  const cueDirection =
    normalize(
      sub(
        ghost,
        cue
      )
    );


  /*
    Determine how severe the cut is.

    This is ONLY used internally.

    It is never shown to the user as a degree.
  */

  const alignment =
    clamp(
      dot(
        cueDirection,
        objectDirection
      ),
      -1,
      1
    );

  const cutDifficulty =
    1-alignment;


  const cueDistance =
    distance(
      cue,
      ghost
    );

  const objectDistance =
    distance(
      object,
      target
    );


  /*
    Direct shots get a substantial preference because
    they are simpler than unnecessary banks.

    However, this does NOT prevent a bank from winning
    when a direct route is poor.
  */

  const score =
    cueDistance*.62+
    objectDistance*.58+
    cutDifficulty*250;


  return {

    type:"cut",

    pocket,

    target,

    ghost,

    cuePath:[
      cue,
      ghost
    ],

    objectPath:[
      object,
      target
    ],

    score,

    alignment

  };

}


/* =========================================================
   RAIL GEOMETRY
========================================================= */

function reflect(
  point,
  rail
){

  if(rail==="left"){

    return {
      x:
        2*TABLE.left-point.x,
      y:
        point.y
    };

  }

  if(rail==="right"){

    return {
      x:
        2*TABLE.right-point.x,
      y:
        point.y
    };

  }

  if(rail==="top"){

    return {
      x:
        point.x,

      y:
        2*TABLE.top-point.y
    };

  }

  return {

    x:
      point.x,

    y:
      2*TABLE.bottom-point.y

  };

}


function intersectRail(
  a,
  b,
  rail
){

  const dx =
    b.x-a.x;

  const dy =
    b.y-a.y;


  /*
    Vertical rail.
  */

  if(
    rail==="left" ||
    rail==="right"
  ){

    if(
      Math.abs(dx)<0.000001
    ){
      return null;
    }

    const x =
      rail==="left"
        ? TABLE.left
        : TABLE.right;

    const t =
      (x-a.x)/dx;

    if(
      t<=0 ||
      t>=1
    ){
      return null;
    }

    const y =
      a.y+dy*t;

    if(
      y <
        TABLE.top+TABLE.ball*1.25 ||
      y >
        TABLE.bottom-TABLE.ball*1.25
    ){

      return null;

    }

    return {
      x,
      y
    };

  }


  /*
    Horizontal rail.
  */

  if(
    Math.abs(dy)<0.000001
  ){
    return null;
  }

  const y =
    rail==="top"
      ? TABLE.top
      : TABLE.bottom;

  const t =
    (y-a.y)/dy;

  if(
    t<=0 ||
    t>=1
  ){
    return null;
  }

  const x =
    a.x+dx*t;

  if(
    x <
      TABLE.left+TABLE.ball*1.25 ||
    x >
      TABLE.right-TABLE.ball*1.25
  ){

    return null;

  }

  return {
    x,
    y
  };

}


/* =========================================================
   TRUE ONE-RAIL BANK
========================================================= */

function calculateBank(
  pocket
){

  const cue =
    state.cue;

  const object =
    state.object;

  let best=null;


  /*
    Evaluate every possible rail.

    This is the key banking engine.

    The target pocket is reflected across each rail.
    The object-ball-to-reflected-pocket line gives the
    exact rail contact point.

    We then reconstruct the REAL route:

        OBJECT
           \
            \
             X  <- rail contact
              \
               \
              POCKET

    This means the displayed bank always ends at the
    actual selected pocket.
  */

  const rails=[
    "left",
    "right",
    "top",
    "bottom"
  ];


  for(
    const rail of rails
  ){

    const reflected =
      reflect(
        pocket,
        rail
      );

    const contact =
      intersectRail(
        object,
        reflected,
        rail
      );

    if(!contact){
      continue;
    }


    /*
      Object -> rail.
    */

    if(
      blocked(
        object,
        contact,
        ["object","cue"]
      )
    ){

      continue;

    }


    /*
      Rail -> pocket.

      This is the critical validation that was missing
      from the earlier behavior.
    */

    if(
      blocked(
        contact,
        pocket,
        ["object","cue"]
      )
    ){

      continue;

    }


    /*
      The object ball must actually be moving toward
      the rail before it reaches the pocket.
    */

    const incoming =
      normalize(
        sub(
          contact,
          object
        )
      );

    const outgoing =
      normalize(
        sub(
          pocket,
          contact
        )
      );


    /*
      Reject mathematically suspicious routes.
    */

    if(
      len(incoming)===0 ||
      len(outgoing)===0
    ){

      continue;

    }


    /*
      Find the cue-ball ghost position based on the
      FIRST leg of the bank.

      The cue ball needs to strike the object ball in
      the direction that sends the object ball to the rail.
    */

    const ghost =
      ghostBall(
        object,
        contact
      );


    if(
      ghost.x <
        TABLE.left+TABLE.ball ||
      ghost.x >
        TABLE.right-TABLE.ball ||
      ghost.y <
        TABLE.top+TABLE.ball ||
      ghost.y >
        TABLE.bottom-TABLE.ball
    ){

      continue;

    }


    /*
      Cue -> ghost.
    */

    if(
      blocked(
        cue,
        ghost,
        ["cue","object"]
      )
    ){

      continue;

    }


    const cueDistance =
      distance(
        cue,
        ghost
      );

    const bankDistance =
      distance(
        object,
        contact
      )+
      distance(
        contact,
        pocket
      );


    /*
      Bank complexity.

      A valid bank gets a REAL candidate score,
      but banks are not artificially rejected.

      This is intentionally much more bank-friendly
      than the prior version.
    */

    const score =
      cueDistance*.52+
      bankDistance*.50+
      35;


    const candidate={

      type:"bank",

      pocket,

      target:pocket,

      rail,

      bankPoint:contact,

      ghost,

      cuePath:[
        cue,
        ghost
      ],

      objectPath:[
        object,
        contact,
        pocket
      ],

      score

    };


    if(
      !best ||
      candidate.score<best.score
    ){

      best=candidate;

    }

  }


  return best;

}


/* =========================================================
   ONE-RAIL KICK
========================================================= */

function calculateKick(
  pocket
){

  const cue =
    state.cue;

  const object =
    state.object;


  let best=null;


  const rails=[
    "left",
    "right",
    "top",
    "bottom"
  ];


  for(
    const rail of rails
  ){

    /*
      Reflect the OBJECT ball across the rail.

      The cue ball can then be routed to the rail contact
      point before contacting the object ball.
    */

    const reflected =
      reflect(
        object,
        rail
      );

    const contact =
      intersectRail(
        cue,
        reflected,
        rail
      );

    if(!contact){
      continue;
    }


    if(
      blocked(
        cue,
        contact,
        ["cue","object"]
      )
    ){

      continue;

    }


    if(
      blocked(
        contact,
        object,
        ["cue","object"]
      )
    ){

      continue;

    }


    /*
      Once the cue ball reaches the object ball, the
      object ball still needs a clear route to the pocket.
    */

    if(
      blocked(
        object,
        pocket,
        ["cue","object"]
      )
    ){

      continue;

    }


    const score =
      distance(cue,contact)*.45+
      distance(contact,object)*.45+
      distance(object,pocket)*.45+
      190;


    const candidate={

      type:"kick",

      pocket,

      target:pocket,

      kickPoint:contact,

      rail,

      cuePath:[
        cue,
        contact,
        object
      ],

      objectPath:[
        object,
        pocket
      ],

      score

    };


    if(
      !best ||
      candidate.score<best.score
    ){

      best=candidate;

    }

  }


  return best;

}


/* =========================================================
   SHOT VALIDATION
========================================================= */

function validShot(
  shot
){

  if(!shot){
    return false;
  }

  if(!shot.pocket){
    return false;
  }

  /*
    Every object route must terminate at the
    ACTUAL selected pocket.
  */

  const finalPoint =
    shot.objectPath[
      shot.objectPath.length-1
    ];

  if(
    distance(
      finalPoint,
      shot.pocket
    )>.001
  ){

    return false;

  }


  /*
    A bank MUST contain exactly the concept we
    are trying to model: object -> rail -> pocket.
  */

  if(
    shot.type==="bank"
  ){

    if(
      !shot.bankPoint ||
      shot.objectPath.length!==3
    ){

      return false;

    }

  }


  return true;

}


/* =========================================================
   FIND BEST SHOT
========================================================= */

function getCandidatesForPocket(
  pocket
){

  const list=[];


  const cut =
    calculateDirect(
      pocket
    );

  if(
    validShot(cut)
  ){

    list.push(cut);

  }


  const bank =
    calculateBank(
      pocket
    );

  if(
    validShot(bank)
  ){

    list.push(bank);

  }


  const kick =
    calculateKick(
      pocket
    );

  if(
    validShot(kick)
  ){

    list.push(kick);

  }


  return list;

}


function analyze(){

  let candidateShots=[];


  /*
    If the user manually chooses a pocket,
    ONLY that pocket is evaluated.

    Otherwise all six are evaluated.
  */

  if(
    state.selectedPocket
  ){

    const pocket =
      getPocketById(
        state.selectedPocket
      );

    candidateShots =
      getCandidatesForPocket(
        pocket
      );

  }else{

    for(
      const pocket of pockets
    ){

      candidateShots.push(
        ...getCandidatesForPocket(
          pocket
        )
      );

    }

  }


  if(
    !candidateShots.length
  ){

    state.shot=null;

    state.suggestedPocket=null;

    updatePocketButtons();

    updateUI();

    return;

  }


  candidateShots.sort(
    (a,b)=>
      a.score-b.score
  );


  /*
    If the user hasn't picked a pocket,
    Shot Caller determines the best one.

    If the user HAS picked a pocket,
    this naturally becomes a recommendation
    specifically for that pocket.
  */

  const best =
    candidateShots[0];


  state.shot=best;

  state.suggestedPocket =
    best.pocket.id;


  updatePocketButtons();
  updateUI();

}


/* =========================================================
   POCKET BUTTON UI
========================================================= */

function updatePocketButtons(){

  pocketButtons.forEach(
    button=>{

      const id =
        button.dataset.pocket;

      button.classList.toggle(
        "selected",
        state.selectedPocket===id
      );

      button.classList.toggle(
        "suggested",
        state.suggestedPocket===id &&
        state.selectedPocket===null
      );

    }
  );

}


/* =========================================================
   AIM DOT
========================================================= */

/*
  The enlarged balls now show ONLY a dot.

  No line.
  No arrow.
  No implied movement direction.

  The dot means:
      "This is where you need to hit/aim."
*/

function positionAimDot(
  dot,
  origin,
  target
){

  const direction =
    normalize(
      sub(
        target,
        origin
      )
    );


  /*
    Convert the actual world direction to a point
    on the enlarged ball.

    50% = center.
  */

  const x =
    50+
    direction.x*31;

  const y =
    50+
    direction.y*31;


  dot.style.left =
    `${clamp(x,8,92)}%`;

  dot.style.top =
    `${clamp(y,8,92)}%`;

}


/* =========================================================
   UI UPDATE
========================================================= */

function updateUI(){

  const shot =
    state.shot;


  if(!shot){

    shotTitle.textContent =
      "I’ll call the shot";

    shotSub.textContent =
      "Move the balls into position and I’ll find the best route.";

    cueTip.textContent =
      "No clear route";

    objectTip.textContent =
      "No clear route";

    why.textContent =
      "Shot Caller could not find a sufficiently clear direct, bank, or kick route to the selected pocket.";

    return;

  }


  if(
    shot.type==="bank"
  ){

    shotTitle.textContent =
      `BANK → ${shot.pocket.label}`;

    shotSub.textContent =
      "One rail. Follow the green path.";

    cueTip.textContent =
      "Hit the red dot";

    objectTip.textContent =
      "Send the object ball to the blue rail mark";


    /*
      Cue ball:
      dot represents the direction required to send
      the cue ball into the object ball correctly.
    */

    positionAimDot(
      cueDot,
      state.cue,
      shot.ghost
    );


    /*
      Object ball:
      dot represents the first contact direction
      toward the bank rail.
    */

    positionAimDot(
      objectDot,
      state.object,
      shot.bankPoint
    );


    why.textContent =
      `The direct route was not the preferred route. Shot Caller calculated a one-rail bank using the ${shot.rail} rail. The blue mark is the calculated rail contact point; the green route then continues from that rail contact directly into the ${shot.pocket.label.toLowerCase()} pocket.`;

    return;

  }


  if(
    shot.type==="kick"
  ){

    shotTitle.textContent =
      `KICK → ${shot.pocket.label}`;

    shotSub.textContent =
      "One rail to the object ball.";

    cueTip.textContent =
      "Hit the red dot";

    objectTip.textContent =
      "Send it to the pocket";


    positionAimDot(
      cueDot,
      state.cue,
      shot.kickPoint
    );


    positionAimDot(
      objectDot,
      state.object,
      shot.pocket
    );


    why.textContent =
      `Shot Caller selected a one-rail kick to contact the object ball and then send it toward the ${shot.pocket.label.toLowerCase()} pocket.`;

    return;

  }


  /*
    DIRECT CUT
  */

  shotTitle.textContent =
    `CUT → ${shot.pocket.label}`;

  shotSub.textContent =
    "Direct route.";

  cueTip.textContent =
    "Hit the red dot";

  objectTip.textContent =
    "Send it to the red pocket";


  positionAimDot(
    cueDot,
    state.cue,
    shot.ghost
  );


  positionAimDot(
    objectDot,
    state.object,
    shot.pocket
  );


  why.textContent =
    `Shot Caller found a clean direct route to the ${shot.pocket.label.toLowerCase()} pocket and selected it because it avoids an unnecessary rail.`;

}


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    TABLE.height/TABLE.width;

  const height =
    rect.width*ratio;

  canvas.style.height =
    `${height}px`;


  state.dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(
      rect.width*state.dpr
    );

  canvas.height =
    Math.round(
      height*state.dpr
    );


  draw();

}


function scale(){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      rect.width/TABLE.width,

    y:
      rect.height/TABLE.height

  };

}


/* =========================================================
   DRAW TABLE
========================================================= */

function roundedRect(
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(
    x+r,
    y
  );

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  ctx.closePath();

}


function drawTable(){

  const s =
    scale();


  ctx.save();

  ctx.setTransform(
    state.dpr*s.x,
    0,
    0,
    state.dpr*s.y,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    TABLE.width,
    TABLE.height
  );


  /*
    Outer table.
  */

  ctx.fillStyle =
    "#1d120b";

  roundedRect(
    0,
    0,
    TABLE.width,
    TABLE.height,
    25
  );

  ctx.fill();


  /*
    Rail.
  */

  ctx.fillStyle =
    "#4c2f1d";

  roundedRect(
    12,
    12,
    TABLE.width-24,
    TABLE.height-24,
    19
  );

  ctx.fill();


  /*
    Inner rail highlight.
  */

  ctx.strokeStyle =
    "#68432a";

  ctx.lineWidth=3;

  roundedRect(
    24,
    24,
    TABLE.width-48,
    TABLE.height-48,
    15
  );

  ctx.stroke();


  /*
    Felt.
  */

  ctx.fillStyle =
    "#146f46";

  roundedRect(
    TABLE.left,
    TABLE.top,
    TABLE.right-TABLE.left,
    TABLE.bottom-TABLE.top,
    8
  );

  ctx.fill();


  /*
    Subtle felt shading.
  */

  const gradient =
    ctx.createLinearGradient(
      TABLE.left,
      TABLE.top,
      TABLE.right,
      TABLE.bottom
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,.035)"
  );

  gradient.addColorStop(
    .5,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.09)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fill();


  drawDiamonds();


  pockets.forEach(
    drawPocket
  );


  ctx.restore();

}


/* =========================================================
   TABLE DIAMONDS
========================================================= */

function drawDiamond(
  x,
  y
){

  ctx.beginPath();

  ctx.moveTo(
    x,
    y-5
  );

  ctx.lineTo(
    x+5,
    y
  );

  ctx.lineTo(
    x,
    y+5
  );

  ctx.lineTo(
    x-5,
    y
  );

  ctx.closePath();

  ctx.fillStyle =
    "#e2cb99";

  ctx.fill();

}


function drawDiamonds(){

  const horizontal=[
    .125,
    .25,
    .375,
    .625,
    .75,
    .875
  ];


  horizontal.forEach(
    ratio=>{

      const x =
        TABLE.left+
        (TABLE.right-TABLE.left)*ratio;

      drawDiamond(
        x,
        TABLE.top-17
      );

      drawDiamond(
        x,
        TABLE.bottom+17
      );

    }
  );


  [.25,.5,.75].forEach(
    ratio=>{

      const y =
        TABLE.top+
        (TABLE.bottom-TABLE.top)*ratio;

      drawDiamond(
        TABLE.left-17,
        y
      );

      drawDiamond(
        TABLE.right+17,
        y
      );

    }
  );

}


/* =========================================================
   POCKET DRAWING
========================================================= */

function drawPocket(
  pocket
){

  /*
    The pocket itself is EXACTLY centered on the
    geometry used by the shot calculations.
  */

  ctx.save();


  ctx.beginPath();

  ctx.arc(
    pocket.x,
    pocket.y,
    TABLE.pocket,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#030504";

  ctx.fill();


  ctx.strokeStyle =
    "rgba(255,255,255,.07)";

  ctx.lineWidth=2;

  ctx.stroke();


  ctx.restore();

}


/* =========================================================
   ROUTES
========================================================= */

function drawRoute(
  points,
  color,
  width,
  dashed=false
){

  if(
    !points ||
    points.length<2
  ){
    return;
  }


  ctx.save();

  ctx.strokeStyle =
    color;

  ctx.lineWidth =
    width;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  if(dashed){

    ctx.setLineDash([
      9,
      8
    ]);

  }


  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );


  for(
    let i=1;
    i<points.length;
    i++
  ){
